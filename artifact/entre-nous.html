<title>Entre Nous</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Instrument+Sans:wght@400..700&display=swap">
<style>
/* Entre Nous.
   Parti pris : une page de carnet étroite et deux encres. Le bleu (rond) est la
   première personne, l'orange (carré) la seconde ; là où les encres se
   recouvrent, c'est ce que le couple partage. */
:root {
  --bg: #f8f9fc;
  --surface: #ffffff;
  --wash: #e9ebf2;
  --line: #d8dbe6;
  --ink: #141829;
  --ink-2: #454b63;
  --muted: #646b82;
  --a: #2a78d6;
  --a-soft: #d6e5f8;
  --b: #eb6834;
  --b-soft: #fbe1d5;
  --good: #0ca30c;
  --warn: #fab219;
  --crit: #d03b3b;
  --on-fill: #ffffff;
  --on-warn: #0b0b0b;
  --btn: #141829;
  --btn-fg: #ffffff;
  --blend: multiply;
  --display: "Bricolage Grotesque", "Avenir Next", "Trebuchet MS", sans-serif;
  --body: "Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  /* Un QR code reste noir sur blanc dans les deux thèmes, sinon il ne se scanne pas. */
  --qr-bg: #ffffff;
  --qr-fg: #000000;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1220;
    --surface: #181c2e;
    --wash: #222740;
    --line: #2e3450;
    --ink: #eef0f7;
    --ink-2: #c5cade;
    --muted: #9299b3;
    --a: #3987e5;
    --a-soft: #1c2f52;
    --b: #d95926;
    --b-soft: #47261a;
    --good: #0ca30c;
    --warn: #fab219;
    --crit: #d03b3b;
    --on-fill: #ffffff;
    --on-warn: #0b0b0b;
    --btn: #eef0f7;
    --btn-fg: #141829;
    --blend: screen;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1220;
  --surface: #181c2e;
  --wash: #222740;
  --line: #2e3450;
  --ink: #eef0f7;
  --ink-2: #c5cade;
  --muted: #9299b3;
  --a: #3987e5;
  --a-soft: #1c2f52;
  --b: #d95926;
  --b-soft: #47261a;
  --good: #0ca30c;
  --warn: #fab219;
  --crit: #d03b3b;
  --on-fill: #ffffff;
  --on-warn: #0b0b0b;
  --btn: #eef0f7;
  --btn-fg: #141829;
  --blend: screen;
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 400 1rem/1.55 var(--body);
  -webkit-font-smoothing: antialiased;
}
h1, h2, h3, p, ul, ol { margin: 0; }
ul, ol { padding: 0; list-style: none; }
a { color: inherit; text-underline-offset: 3px; }
button, input, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--a); outline-offset: 2px; }
[tabindex="-1"]:focus { outline: none; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- Structure ---------- */
.top, .wrap {
  max-width: 46rem;
  margin-inline: auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.top { display: flex; align-items: center; justify-content: space-between; gap: 1rem; padding-block: 1rem; }
.wrap { display: flex; flex-direction: column; gap: 2.5rem; padding-block: 0.5rem 4rem; }
.wrap.narrow { gap: 1.1rem; color: var(--ink-2); }
.wrap.narrow h1, .wrap.narrow h2, .wrap.narrow h3, .wrap.narrow b { color: var(--ink); }

.brand { display: inline-flex; align-items: center; gap: 0.55rem; font: 700 1.15rem var(--display); letter-spacing: -0.01em; text-decoration: none; }
.logo { width: 2.2rem; height: auto; }
.link { padding: 0.25rem 0; border: 0; background: none; color: var(--ink-2); font-size: 0.94rem; text-decoration: underline; text-underline-offset: 3px; cursor: pointer; }
.link:hover { color: var(--ink); }
.eyebrow { font: 600 0.78rem var(--body); letter-spacing: 0.07em; text-transform: uppercase; color: var(--muted); }
.muted { color: var(--muted); font-size: 0.9rem; }

/* Les deux encres */
.inks { isolation: isolate; overflow: visible; }
.ink-a { fill: var(--a); mix-blend-mode: var(--blend); }
.ink-b { fill: var(--b); mix-blend-mode: var(--blend); }
.ring-a, .ring-b { fill: none; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; mix-blend-mode: var(--blend); }
.ring-a { stroke: var(--a); }
.ring-b { stroke: var(--b); }
.sw { display: inline-block; flex: none; width: 0.7rem; height: 0.7rem; border-radius: 50%; background: var(--a); }
.sw.b { border-radius: 3px; background: var(--b); }

/* ---------- Boutons et champs ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center;
  padding: 0.85rem 1.4rem; border: 1.5px solid var(--btn); border-radius: 999px;
  background: var(--btn); color: var(--btn-fg);
  font-weight: 600; text-align: center; text-decoration: none; cursor: pointer;
}
.btn:hover { opacity: 0.88; }
.btn.alt { background: transparent; border-color: var(--ink); color: var(--ink); }
.btn.alt:hover { background: var(--wash); opacity: 1; }
.btn.small { padding: 0.5rem 1rem; font-size: 0.92rem; }
.btn:disabled { opacity: 0.35; cursor: default; }
.actions { display: flex; flex-wrap: wrap; gap: 0.6rem; }

.names { display: flex; flex-wrap: wrap; gap: 0.75rem; }
.name { flex: 1 1 12rem; min-width: 0; display: flex; flex-direction: column; gap: 0.3rem; font-size: 0.85rem; color: var(--ink-2); }
.name span { display: flex; align-items: center; gap: 0.4rem; }
.name input { width: 100%; padding: 0.7rem 0.9rem; border: 1.5px solid var(--line); border-radius: 12px; background: var(--surface); color: var(--ink); font-size: 1rem; }
.name.a input:focus-visible { outline-color: var(--a); }
.name.b input:focus-visible { outline-color: var(--b); }

.panel { display: flex; flex-direction: column; gap: 0.8rem; padding: 1.1rem; border: 1px solid var(--line); border-radius: 18px; background: var(--surface); }
.code-form, .share { display: flex; flex-direction: column; align-items: flex-start; gap: 0.5rem; }
.code-form label, .share label { font-size: 0.88rem; font-weight: 600; color: var(--ink); }
.code-form textarea, .share textarea {
  width: 100%; padding: 0.7rem 0.9rem; border: 1.5px solid var(--line); border-radius: 12px;
  background: var(--surface); color: var(--ink); font: 0.82rem/1.45 var(--mono); overflow-wrap: anywhere; resize: vertical;
}
.share-row { display: flex; flex-wrap: wrap; align-items: center; gap: 0.8rem; }
.share-msg { font-size: 0.88rem; color: var(--ink-2); }
.err { padding-left: 0.7rem; border-left: 3px solid var(--crit); font-size: 0.92rem; color: var(--ink); }

/* ---------- Accueil ---------- */
.hero { display: flex; flex-direction: column; gap: 1rem; padding-top: 1.5rem; }
.hero h1 { font: 700 clamp(2.5rem, 9vw, 4.2rem)/1 var(--display); letter-spacing: -0.035em; text-wrap: balance; }
.sub { max-width: 36rem; font-size: 1.125rem; color: var(--ink-2); }
.banner { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 0.8rem 1.2rem; padding: 1rem 1.1rem; border-radius: 18px; background: var(--wash); }
.banner-actions { display: flex; align-items: center; gap: 1rem; }

.group { display: flex; flex-direction: column; gap: 0.9rem; }
.group-title { font: 600 0.8rem var(--body); letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.cards { display: flex; flex-direction: column; gap: 0.6rem; }
.card { position: relative; display: flex; align-items: flex-start; gap: 1rem; padding: 1.1rem; border: 1px solid var(--line); border-radius: 18px; background: var(--surface); transition: border-color 0.15s; }
.card:hover { border-color: var(--ink); }
.glyph { flex: none; width: 3rem; }
.glyph svg { display: block; width: 100%; height: auto; }
.glyph.big { width: 4.5rem; }
.card-body { min-width: 0; display: flex; flex-direction: column; gap: 0.3rem; }
.card h3 { font: 650 1.3rem/1.2 var(--display); letter-spacing: -0.015em; text-wrap: balance; }
.card-link { text-decoration: none; }
.card-link::after { content: ""; position: absolute; inset: 0; border-radius: 18px; }
.card-link:focus-visible { outline: none; }
.card-link:focus-visible::after { outline: 2px solid var(--a); outline-offset: 2px; }
.blurb { font-size: 0.95rem; color: var(--ink-2); }
.meta { font-size: 0.85rem; color: var(--muted); }
.card-state { position: relative; z-index: 1; align-self: flex-start; padding-top: 0.3rem; font-size: 0.9rem; }
.foot { display: flex; flex-direction: column; gap: 0.4rem; max-width: 40rem; padding-top: 1.2rem; border-top: 1px solid var(--line); font-size: 0.88rem; color: var(--muted); }

/* ---------- Présentation d'un test, passage de main, attente ---------- */
.intro, .wait { padding-top: 1rem; }
.handoff { padding-top: 3rem; }
.intro h1, .handoff h1, .wait h1 { font: 700 clamp(1.9rem, 6.5vw, 2.75rem)/1.08 var(--display); letter-spacing: -0.025em; text-wrap: balance; }
.wait h2 { padding-top: 1rem; font: 650 1.3rem/1.2 var(--display); }
.facts { display: flex; flex-wrap: wrap; gap: 0.4rem 1.4rem; padding-block: 0.4rem; font-size: 0.95rem; }
.hint, .prev { font-size: 0.9rem; color: var(--muted); }
.note { padding: 0.8rem 1rem; border-radius: 12px; background: var(--wash); font-size: 0.88rem; color: var(--ink-2); }
.invite { padding: 0.9rem 1rem; border-radius: 14px; background: var(--a-soft); color: var(--ink); }

/* ---------- Questions ---------- */
.quiz { --who: var(--a); --who-soft: var(--a-soft); padding-top: 1rem; }
.quiz[data-who="b"] { --who: var(--b); --who-soft: var(--b-soft); }
.quiz-top { display: flex; align-items: center; justify-content: space-between; gap: 0.8rem; font-size: 0.9rem; }
.chip { display: inline-flex; align-items: center; gap: 0.45rem; min-width: 0; padding: 0.3rem 0.75rem; border-radius: 999px; background: var(--who-soft); color: var(--ink); font-weight: 600; }
.count { color: var(--muted); font-variant-numeric: tabular-nums; }
.progress { height: 6px; border-radius: 999px; background: var(--who-soft); overflow: hidden; }
.progress span { display: block; height: 100%; border-radius: 999px; background: var(--who); transition: width 0.25s; }
.question { min-height: 2.4em; padding-block: 0.2rem 0.6rem; font: 650 clamp(1.45rem, 5vw, 2.05rem)/1.18 var(--display); letter-spacing: -0.02em; text-wrap: balance; }
.options { display: flex; flex-direction: column; gap: 0.55rem; }
.opt {
  display: flex; align-items: center; gap: 0.8rem; width: 100%; padding: 0.9rem 1rem;
  border: 1.5px solid var(--line); border-radius: 14px; background: var(--surface); color: var(--ink);
  font-size: 1.02rem; text-align: left; cursor: pointer; transition: border-color 0.12s, background 0.12s;
}
.opt:hover { border-color: var(--ink); }
.opt.on { border-color: var(--who); background: var(--who-soft); }
.opt kbd { flex: none; display: grid; place-items: center; width: 1.6rem; height: 1.6rem; border-radius: 8px; background: var(--wash); color: var(--muted); font: 600 0.78rem var(--body); }
.opt.on kbd { background: var(--who); color: var(--on-fill); }
.opt span { min-width: 0; }
.quiz-nav { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 0.6rem; padding-top: 0.8rem; }
@media (prefers-reduced-motion: no-preference) {
  .question, .options { animation: rise 0.22s ease-out; }
  @keyframes rise { from { opacity: 0.4; transform: translateY(6px); } }
}

/* ---------- Rapport ---------- */
.report { gap: 2.75rem; }
.rep-head { display: flex; flex-direction: column; gap: 0.5rem; padding-top: 0.5rem; }
.rep-head h1 { display: flex; flex-wrap: wrap; align-items: center; gap: 0.1em 0.3em; font: 700 clamp(2rem, 7.5vw, 3.2rem)/1.05 var(--display); letter-spacing: -0.03em; }
.rep-head h1 span { display: inline-flex; align-items: center; gap: 0.22em; min-width: 0; overflow-wrap: anywhere; }
.rep-head h1 .amp { color: var(--muted); font-weight: 500; }
.rep-head .sw { width: 0.4em; height: 0.4em; }

.hero-block { display: flex; flex-direction: column; gap: 1.25rem; }
.hero-fig { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); align-items: center; gap: 1rem 2rem; }
.venn { display: block; width: 100%; max-width: 22rem; height: auto; }
.hero-num { font: 700 clamp(3.5rem, 15vw, 5.5rem)/0.95 var(--body); letter-spacing: -0.04em; }
.hero-num span { font-size: 0.42em; font-weight: 600; letter-spacing: 0; }
.hero-lab { padding-top: 0.3rem; font: 600 0.8rem var(--body); letter-spacing: 0.07em; text-transform: uppercase; color: var(--muted); }
.hero-head { padding-top: 0.7rem; font: 600 1.35rem/1.25 var(--display); text-wrap: balance; }
.counts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0.6rem; }
.counts li { display: flex; flex-direction: column; align-items: flex-start; gap: 0.3rem; padding: 0.9rem 1rem; border: 1px solid var(--line); border-radius: 16px; background: var(--surface); font-size: 0.9rem; color: var(--ink-2); }
.counts b { font: 700 1.9rem/1 var(--body); color: var(--ink); }
.hero-note { max-width: 38rem; color: var(--ink-2); }
@media (max-width: 34rem) {
  .hero-fig { grid-template-columns: minmax(0, 1fr); }
  .venn { max-width: 16rem; }
}

.sec { display: flex; flex-direction: column; gap: 0.9rem; }
.sec h2 { font: 700 1.6rem/1.15 var(--display); letter-spacing: -0.02em; text-wrap: balance; }
.sec-sub { margin-top: -0.45rem; max-width: 38rem; color: var(--ink-2); }
.summary p { max-width: 38rem; color: var(--ink-2); }
.summary b { color: var(--ink); }

/* Pastilles d'état : = accord, ≈ proche, ≠ écart */
.st { display: inline-flex; align-items: center; gap: 0.4rem; font-size: 0.82rem; font-weight: 600; color: var(--ink); white-space: nowrap; }
.st i { display: grid; place-items: center; width: 1.3rem; height: 1.3rem; border-radius: 50%; background: var(--good); color: var(--on-fill); font: 700 0.85rem/1 var(--body); }
.st.near i { background: var(--warn); color: var(--on-warn); }
.st.gap i { background: var(--crit); }
.st.skip { font-weight: 500; color: var(--muted); }
.legend { display: flex; flex-wrap: wrap; gap: 0.4rem 1.2rem; font-size: 0.88rem; color: var(--ink-2); }
.legend li { display: inline-flex; align-items: center; gap: 0.4rem; }

/* Graphiques */
.chart { display: flex; flex-direction: column; align-items: center; gap: 0.4rem; }
.chart-cap { font-size: 0.82rem; color: var(--muted); }
.radar { width: 100%; max-width: 30rem; height: auto; overflow: visible; }
.radar .grid, .quad .grid { fill: none; stroke: var(--line); stroke-width: 1; }
.radar .tick { fill: var(--muted); font: 500 10px var(--body); }
.radar .axis { fill: var(--ink-2); font: 600 13px var(--body); }
.shape { stroke-width: 2; stroke-linejoin: round; }
.shape.m { fill: var(--ink); fill-opacity: 0.07; stroke: var(--ink-2); }
.shape.a { fill: var(--a); fill-opacity: 0.14; stroke: var(--a); }
.shape.b { fill: var(--b); fill-opacity: 0.14; stroke: var(--b); }
.pt { stroke: var(--bg); stroke-width: 2; }
.pt.a { fill: var(--a); }
.pt.b { fill: var(--b); }
.mark circle { fill: var(--good); stroke: var(--bg); stroke-width: 2; }
.mark.near circle { fill: var(--warn); }
.mark.gap circle { fill: var(--crit); }
.mark text { fill: var(--on-fill); font: 700 11px var(--body); }
.mark.near text { fill: var(--on-warn); }
.quad { width: 100%; max-width: 22rem; height: auto; }
.quad .plot { fill: var(--surface); stroke: var(--line); stroke-width: 1; }
.quad .zone { fill: var(--muted); font: 600 11px var(--body); letter-spacing: 0.05em; text-transform: uppercase; }
.quad .axis { fill: var(--ink-2); font: 600 12px var(--body); }
.quad .who { fill: var(--ink); font: 700 13px var(--body); }
.quad .pt { stroke: var(--surface); }

/* Carte des domaines : nom, barre segmentée, pourcentage, état */
.doms { display: flex; flex-direction: column; }
.dom { display: grid; grid-template-columns: minmax(0, 13rem) minmax(4rem, 1fr) 3.6rem 8.4rem; align-items: center; gap: 0.3rem 0.9rem; padding-block: 0.7rem; border-top: 1px solid var(--line); }
.dom-name { min-width: 0; font-weight: 600; }
.seg { display: flex; gap: 2px; height: 8px; min-width: 0; }
.seg i { flex: 0 0 0; min-width: 4px; border-radius: 999px; background: var(--good); }
.seg .near { background: var(--warn); }
.seg .gap { background: var(--crit); }
.num { font-weight: 700; font-variant-numeric: tabular-nums; text-align: right; }
@media (max-width: 38rem) {
  .dom { grid-template-columns: minmax(0, 1fr) auto; }
  .dom .dom-name { grid-area: 1 / 1; }
  .dom .num { grid-area: 1 / 2; }
  .dom .seg { grid-area: 2 / 1 / 3 / -1; }
  .dom .dom-st { grid-area: 3 / 1 / 4 / -1; }
}

/* Barres de profil et de climat */
.bars { display: grid; grid-template-columns: max-content minmax(3rem, 1fr) 2.2rem minmax(0, max-content); align-items: center; gap: 0.45rem 0.7rem; }
.bar-who { display: inline-flex; align-items: center; gap: 0.4rem; max-width: 9rem; min-width: 0; font-size: 0.9rem; font-weight: 600; overflow-wrap: anywhere; }
.track { display: block; height: 10px; border-radius: 4px; background: var(--a-soft); overflow: hidden; }
.track.b { background: var(--b-soft); }
.bar { display: block; height: 100%; border-radius: 0 4px 4px 0; background: var(--a); }
.track.b .bar { background: var(--b); }
.lvl { font-size: 0.82rem; color: var(--muted); }
@media (max-width: 30rem) {
  .bars { grid-template-columns: max-content minmax(2rem, 1fr) 2.2rem; }
  .lvl { grid-column: 2 / -1; margin-top: -0.3rem; }
}
.pairs { display: flex; flex-direction: column; gap: 1.5rem; }
.pair { display: flex; flex-direction: column; gap: 0.45rem; padding-top: 1.2rem; border-top: 1px solid var(--line); }
.pair h3 { font: 650 1.15rem/1.2 var(--display); }
.pair-desc { font-size: 0.9rem; color: var(--muted); }
.pair-text { max-width: 38rem; padding-top: 0.3rem; color: var(--ink-2); }

/* Questions et réponses côte à côte */
.qtext { font-size: 1.05rem; font-weight: 600; }
.answers { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0.5rem; }
.ans { display: flex; flex-direction: column; gap: 0.15rem; min-width: 0; padding: 0.6rem 0.75rem; border-radius: 12px; background: var(--wash); }
.ans-who { display: inline-flex; align-items: center; gap: 0.4rem; font-size: 0.78rem; font-weight: 600; color: var(--ink-2); }
.ans-val { font-size: 0.95rem; overflow-wrap: anywhere; }
@media (max-width: 26rem) { .answers { grid-template-columns: minmax(0, 1fr); } }

.talks { display: flex; flex-direction: column; gap: 0.8rem; }
.talk { display: flex; flex-direction: column; gap: 0.6rem; padding: 1.1rem; border: 1px solid var(--line); border-radius: 18px; background: var(--surface); }
.prompt { font-style: italic; color: var(--ink-2); }
.prompt span { display: block; font: 600 0.75rem var(--body); letter-spacing: 0.07em; text-transform: uppercase; color: var(--muted); }

.verdict { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1.4rem 1.6rem; }
.vcol { display: flex; flex-direction: column; gap: 0.5rem; }
.vcol h3 { display: flex; align-items: center; gap: 0.45rem; font: 650 1.05rem/1.2 var(--display); }
.vcount { font-weight: 500; color: var(--muted); }
.vcol ul { display: flex; flex-direction: column; gap: 0.3rem; font-size: 0.95rem; color: var(--ink-2); }
@media (max-width: 34rem) { .verdict { grid-template-columns: minmax(0, 1fr); } }

.dets { border-bottom: 1px solid var(--line); }
.det { border-top: 1px solid var(--line); }
.det summary { display: flex; align-items: center; justify-content: space-between; gap: 1rem; padding-block: 0.9rem; list-style: none; cursor: pointer; }
.det summary::-webkit-details-marker { display: none; }
.det-name { min-width: 0; font-weight: 600; }
.det-name::before { content: "+"; display: inline-block; width: 1.2rem; color: var(--muted); font-weight: 500; }
.det[open] .det-name::before { content: "–"; }
.det-counts { flex: none; display: inline-flex; gap: 0.7rem; }
.qlist { display: flex; flex-direction: column; gap: 1.1rem; }
.det .qlist { padding-bottom: 1.3rem; }
.qrow { display: flex; flex-direction: column; align-items: flex-start; gap: 0.45rem; }
.qrow .answers { align-self: stretch; }

/* Répartition des tâches : une barre par point de vue */
.splits { display: flex; flex-direction: column; gap: 0.8rem; }
.split-row { display: flex; flex-direction: column; gap: 0.3rem; }
.split-lab { font-size: 0.9rem; font-weight: 600; }
.split { display: flex; gap: 2px; height: 28px; }
.split span { flex: 0 0 0; min-width: 6px; display: flex; align-items: center; padding-inline: 0.5rem; border-radius: 4px; background: var(--a); color: var(--on-fill); font-size: 0.85rem; font-weight: 700; font-variant-numeric: tabular-nums; }
.split .b { justify-content: flex-end; background: var(--b); }

/* Accueil : résultats déjà obtenus */
.res { display: grid; grid-template-columns: minmax(0, 12rem) minmax(3rem, 1fr) 3.6rem; align-items: center; gap: 0.55rem 0.9rem; }
.res li { display: contents; }
.res a { min-width: 0; font-weight: 600; }
.track.m { background: var(--wash); }
.track.m .bar { background: var(--ink-2); }

/* Partage : QR code, feuille de partage, copie */
.share-main { align-self: stretch; display: flex; flex-wrap: wrap; align-items: center; gap: 1rem 1.25rem; }
.qr-box { flex: none; width: 12rem; max-width: 100%; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.qr { display: block; width: 100%; height: auto; }
.qr-bg { fill: var(--qr-bg); }
.qr-fg { fill: var(--qr-fg); }
.share-side { flex: 1 1 14rem; min-width: 0; display: flex; flex-direction: column; gap: 0.6rem; }
.share-label { font-weight: 600; color: var(--ink); }
.share-raw { align-self: stretch; font-size: 0.88rem; color: var(--muted); }
.share-raw summary { cursor: pointer; }
.share-raw textarea { margin-top: 0.5rem; }

/* Page d'attente : état de la synchronisation */
.sync { display: flex; align-items: center; gap: 0.65rem; padding: 0.8rem 1rem; border-radius: 12px; background: var(--wash); color: var(--ink); font-weight: 600; }
.sync::before { content: ""; flex: none; width: 0.6rem; height: 0.6rem; border-radius: 50%; background: var(--a); }
.sync.is-err::before { background: var(--crit); }
@media (prefers-reduced-motion: no-preference) {
  .sync:not(.is-err)::before { animation: pulse 1.4s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: 0.25; } }
}
.more { padding-block: 0.8rem; border-top: 1px solid var(--line); }
.more summary { cursor: pointer; font-weight: 600; color: var(--ink); }
.more > * + * { margin-top: 0.8rem; }

/* Jeux : styles partagés par tous les jeux (les règles propres à un jeu sont dans
   jeux/<id>.css). Mêmes encres que le reste du site : bleu pour la première personne,
   orange pour la seconde. */

/* L'encre d'un joueur, pour tout ce qui lui appartient à l'écran. */
.game, .g-pass { --who: var(--ink); --who-soft: var(--wash); }
.as-a { --who: var(--a); --who-soft: var(--a-soft); }
.as-b { --who: var(--b); --who-soft: var(--b-soft); }

/* ---------- Cadre d'une partie ---------- */
.g-top { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; padding-block: 0.8rem; }
.g-top > :last-child { justify-self: end; }
/* Un titre long passe sur deux lignes plutôt que de déborder sur la pastille de liaison. */
.g-name { min-width: 0; font: 600 0.78rem/1.3 var(--body); letter-spacing: 0.07em; text-transform: uppercase; text-align: center; text-wrap: balance; color: var(--muted); }
.g-net { display: inline-flex; align-items: center; gap: 0.4rem; font-size: 0.82rem; font-weight: 600; color: var(--ink-2); white-space: nowrap; }
.g-net::before { content: ""; flex: none; width: 0.5rem; height: 0.5rem; border-radius: 50%; background: var(--good); }
.g-net[data-net="wait"]::before { background: var(--warn); }
.g-net[data-net="err"]::before, .g-net[data-net="full"]::before { background: var(--crit); }

.game { gap: 1.1rem; min-height: calc(100vh - 4.5rem); min-height: calc(100dvh - 4.5rem); padding-block: 0.5rem 1.5rem; }
.game button { touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
.g-foot { margin-top: auto; padding-top: 1.5rem; text-align: center; font-size: 0.85rem; }
.g-foot .link { color: var(--muted); }
/* Lien qui sert de bouton : 44 px de haut, la taille d'un doigt. */
.g-link { display: inline-flex; align-items: center; min-height: 44px; }
.banner-actions .btn { min-height: 44px; }
/* La racine de chaque écran de jeu (data-screen) reprend la colonne de l'écran. */
.game > [data-screen] { flex: 1 1 auto; display: flex; flex-direction: column; gap: 1.1rem; }
.g-gone { display: flex; flex-wrap: wrap; align-items: center; gap: 0 0.6rem; }

.g-title { font: 700 clamp(1.7rem, 6vw, 2.4rem)/1.1 var(--display); letter-spacing: -0.025em; text-wrap: balance; }
.g-lead { font-size: 1.05rem; color: var(--ink-2); }
.g-note { padding: 0.8rem 1rem; border-radius: 12px; background: var(--wash); font-size: 0.9rem; color: var(--ink-2); }

/* Pastille « encre + prénom » */
.g-who { display: inline-flex; align-items: center; gap: 0.45rem; max-width: 100%; padding: 0.3rem 0.75rem; border-radius: 999px; background: var(--a-soft); color: var(--ink); font-size: 0.9rem; font-weight: 600; overflow-wrap: anywhere; }
.g-who.b { background: var(--b-soft); }

/* Étiquette courte (type de carte, « Adultes »…) */
.g-tag { display: inline-flex; align-items: center; align-self: flex-start; padding: 0.2rem 0.6rem; border-radius: 999px; background: var(--wash); color: var(--ink-2); font: 600 0.72rem var(--body); letter-spacing: 0.06em; text-transform: uppercase; white-space: nowrap; }
.g-tag.a { background: var(--a-soft); color: var(--ink); }
.g-tag.b { background: var(--b-soft); color: var(--ink); }

/* Grande carte à jouer */
.g-card { display: flex; flex-direction: column; justify-content: center; gap: 0.9rem; min-height: 15rem; padding: 1.5rem 1.3rem; border: 1px solid var(--line); border-radius: 22px; background: var(--surface); color: var(--ink); }
.g-card.a { border-color: transparent; background: var(--a-soft); }
.g-card.b { border-color: transparent; background: var(--b-soft); }
.g-card-text { font: 650 clamp(1.35rem, 5vw, 1.8rem)/1.2 var(--display); letter-spacing: -0.015em; text-wrap: balance; overflow-wrap: anywhere; }

/* Champ de saisie (16 px au moins : en dessous, iOS zoome sur le champ) */
.g-field { width: 100%; min-height: 3.2rem; padding: 0.8rem 1rem; border: 1.5px solid var(--line); border-radius: 14px; background: var(--surface); color: var(--ink); font-size: 1.15rem; }
.g-field:focus-visible { outline-color: var(--who); }

/* Score à deux */
.g-score { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0.6rem; }
.g-score > * { display: flex; flex-direction: column; align-items: flex-start; gap: 0.4rem; min-width: 0; padding: 0.9rem 1rem; border: 1px solid var(--line); border-radius: 16px; background: var(--surface); }
.g-score b { font: 700 2rem/1 var(--body); font-variant-numeric: tabular-nums; color: var(--ink); }
.g-big { font: 700 clamp(3.2rem, 15vw, 5.2rem)/0.95 var(--body); letter-spacing: -0.04em; font-variant-numeric: tabular-nums; color: var(--ink); }

/* Rangée de boutons collée en bas de l'écran, à portée de pouce */
.g-actions { position: sticky; bottom: 0; z-index: 2; display: flex; flex-wrap: wrap; gap: 0.6rem; margin-top: auto; padding-block: 0.8rem max(0.8rem, env(safe-area-inset-bottom, 0px)); background: linear-gradient(to top, var(--bg) 70%, transparent); }
.g-actions .btn { flex: 1 1 8rem; min-height: 3rem; }
.g-actions + .g-foot { margin-top: 0; padding-top: 0.3rem; }

/* Passage du téléphone, attente de l'autre */
.g-pass { display: flex; flex-direction: column; gap: 1.1rem; padding-top: 2.5rem; }
.g-pass h1 { font: 700 clamp(1.9rem, 6.5vw, 2.75rem)/1.08 var(--display); letter-spacing: -0.025em; text-wrap: balance; color: var(--ink); }
.g-pass .btn { gap: 0.55rem; }
.g-wait { display: flex; flex-direction: column; gap: 0.6rem; }
.sync.is-here::before { background: var(--good); animation: none; }

/* Options sur la présentation d'un jeu */
.g-opts { display: flex; flex-direction: column; gap: 0.45rem; }
.g-opts-label { font: 600 0.78rem var(--body); letter-spacing: 0.07em; text-transform: uppercase; color: var(--muted); }
.g-choices { display: grid; grid-template-columns: repeat(auto-fill, minmax(9.5rem, 1fr)); gap: 0.5rem; }
.g-choice { display: flex; flex-direction: column; gap: 0.2rem; min-height: 3rem; padding: 0.65rem 0.85rem; border: 1.5px solid var(--line); border-radius: 14px; background: var(--surface); color: var(--ink); text-align: left; cursor: pointer; transition: border-color 0.12s, background 0.12s; }
.g-choice:hover { border-color: var(--ink); }
.g-choice[aria-pressed="true"] { border-color: var(--ink); background: var(--wash); }
.g-choice[aria-pressed="true"] .g-tag { background: var(--surface); }
.g-choice b { display: flex; flex-wrap: wrap; align-items: center; gap: 0.4rem; font-weight: 600; }
.g-choice > span { font-size: 0.85rem; color: var(--ink-2); }

/* Le match des envies. */
/* Une carte qui part vers la droite ne doit pas élargir la page le temps du geste. */
main[data-game="match"] { overflow-x: clip; }
.match { flex: 1 1 auto; display: flex; flex-direction: column; gap: 1rem; }
.match-head { display: flex; align-items: center; gap: 0.5rem; font-size: 0.95rem; color: var(--ink-2); }
.match .g-who { background: var(--who-soft); }
.match-count { flex: none; margin-left: auto; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }

/* La carte du dessus et, derrière elle, ce qu'il reste du paquet. */
.match-stage { position: relative; flex: 1 1 auto; display: flex; min-height: 11.5rem; max-height: 22rem; margin-bottom: 0.9rem; }
.match-stage::before, .match-stage::after { content: ""; position: absolute; inset: 0; border-radius: 22px; background: var(--who-soft); transform-origin: 50% 100%; }
.match-stage::before { transform: translateY(0.9rem) scale(0.9); opacity: 0.5; }
.match-stage::after { transform: translateY(0.45rem) scale(0.95); }
.match-stage[data-left="1"]::before, .match-stage[data-left="1"]::after, .match-stage[data-left="2"]::before { content: none; }
/* La carte se saisit : pendant le geste, le navigateur ne doit ni faire défiler la page ni sélectionner le texte. */
.match-card { position: relative; z-index: 1; flex: 1 1 auto; display: grid; grid-template-rows: 1fr auto; justify-content: normal; min-width: 0; min-height: 0; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; cursor: grab; }
.match-card:active { cursor: grabbing; }
.match-card .g-card-text { grid-row: 1; align-self: center; }
.match-card .g-tag { grid-row: 2; justify-self: start; }
/* Page plus haute que l'écran : le glisser vers le haut reste au défilement (voir mount), et l'aide n'en parle pas. */
.match.is-flat .match-card { touch-action: pan-y; }
.match.is-flat .match-up { display: none; }
.match-prev .link { min-height: 44px; }
/* Le tampon reprend l'allure du bouton de la même réponse. Il se pose à cheval sur le bord haut de la
   carte : le pouce ne le cache pas, et il ne couvre jamais le texte. */
.match-stamp { position: absolute; top: 0; left: 50%; display: inline-flex; align-items: center; min-height: 2.2rem; padding: 0 0.95rem; border: 1.5px solid var(--ink); border-radius: 999px; background: var(--surface); color: var(--ink); font-weight: 600; white-space: nowrap; opacity: 0; transform: translate(-50%, -50%); pointer-events: none; }
.match-stamp.k1 { border-color: transparent; background: var(--who-soft); }
.match-stamp.k2 { border-color: var(--btn); background: var(--btn); color: var(--btn-fg); }
.match-stamp.is-on { transform: translate(-50%, -50%) scale(1.12); }
.match-keys { display: none; }
@media (hover: hover) and (pointer: fine) { .match-keys { display: inline; } }
@media (prefers-reduced-motion: no-preference) {
  .match-card.is-back { transition: transform 0.2s ease-out; }
  .match-card.is-out { transition: transform 0.18s ease-in, opacity 0.18s ease-in; }
  .match-stamp { transition: opacity 0.12s, transform 0.12s; }
  .match-card .g-card-text { animation: match-in 0.2s ease-out; }
  @keyframes match-in { from { opacity: 0; transform: translateY(6px); } }
}

/* Trois réponses à portée de pouce, de la plus tiède à la plus franche ; dessous, de quoi se reprendre. */
/* Fond plein : ce qui passe sous la rangée ne doit pas se lire à travers elle ni à travers « Non ». */
.match-acts { row-gap: 0.75rem; background: linear-gradient(to top, var(--bg) calc(100% - 0.8rem), transparent); }
.match-acts .btn.alt:not(:hover) { background: var(--bg); }
.match-acts .hint { flex: 1 0 100%; }
.match-acts .btn { flex: 1 1 auto; min-height: 3.5rem; padding-inline: 0.7rem; font-size: clamp(0.9rem, 4.1vw, 1rem); }
.match-soft { border-color: transparent; background: var(--who-soft); color: var(--ink); }
.match-more { flex: 1 0 100%; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 0 1rem; }
.match-more .link:last-child { margin-left: auto; }
.match-more .link, .match-keep .link { min-height: 44px; }

/* Résultat : les deux encres se recouvrent d'autant plus que le paquet a plu aux deux. */
.match-venn { display: flex; justify-content: center; }
.match-venn .venn { max-width: 11rem; }
.match .g-big { display: block; }
.match .g-choice[aria-current="true"] { border-color: var(--ink); background: var(--wash); }
.match-list { display: flex; flex-direction: column; border-bottom: 1px solid var(--line); }
.match-list li { display: flex; align-items: center; gap: 0.8rem; padding-block: 0.6rem; border-top: 1px solid var(--line); }
.match-idea { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; align-items: flex-start; gap: 0.3rem; color: var(--ink); font-weight: 600; overflow-wrap: anywhere; }
.match-from { font-size: 0.82rem; font-weight: 400; color: var(--muted); }
.match-duo { background: linear-gradient(90deg, var(--a-soft), var(--b-soft)); color: var(--ink); }
.match-list .is-done p { color: var(--muted); text-decoration: line-through; }

/* « Fait » : une pastille à cocher, large comme un doigt. */
.match-done { position: relative; flex: none; display: inline-flex; align-items: center; gap: 0.45rem; min-height: 44px; padding: 0 0.9rem 0 0.7rem; border: 1.5px solid var(--line); border-radius: 999px; background: var(--surface); color: var(--ink-2); font-size: 0.88rem; font-weight: 600; cursor: pointer; }
.match-done:hover { border-color: var(--ink); }
.match-done::before { content: ""; width: 1.05rem; height: 1.05rem; border: 1.5px solid var(--muted); border-radius: 50%; }
.match-done::after { content: ""; position: absolute; left: 1.07rem; top: 50%; width: 0.3rem; height: 0.56rem; margin-top: -0.36rem; border: solid var(--on-fill); border-width: 0 2px 2px 0; transform: rotate(45deg); opacity: 0; }
.match-done[aria-pressed="true"] { border-color: var(--good); color: var(--ink); }
.match-done[aria-pressed="true"]::before { border-color: var(--good); background: var(--good); }
.match-done[aria-pressed="true"]::after { opacity: 1; }

/* « Nos envies », sous la présentation du jeu */
.match-keep summary { padding-block: 0.65rem; }
.match-keep summary .g-tag { margin-left: 0.3rem; vertical-align: 0.1em; }

/* Sur la même longueur d'onde. */
.onde { flex: 1 1 auto; display: flex; flex-direction: column; gap: 1rem; }
/* Un mot ou un prénom sans espace passe à la ligne au lieu de faire défiler la page de côté. */
.onde .g-title, .onde .g-lead, .onde .hint, .onde .eyebrow, .onde .sync, .onde-theme { overflow-wrap: anywhere; }
.onde-top { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 0.2rem 1rem; }
.onde-step { font: 600 0.78rem var(--body); letter-spacing: 0.07em; text-transform: uppercase; color: var(--muted); }
.onde-score { font-size: 0.9rem; color: var(--ink-2); }
.onde-score b { color: var(--ink); font-variant-numeric: tabular-nums; }
.onde-who { display: flex; align-items: center; gap: 0.5rem; font-size: 0.95rem; color: var(--ink-2); }
.onde .g-who { background: var(--who-soft); }
.onde-form { flex: 1 1 auto; display: flex; flex-direction: column; gap: 0.8rem; }
/* Sans cela le navigateur impose son gris, trop pâle sur le fond sombre. */
.onde-form .g-field::placeholder { color: var(--muted); opacity: 1; }

/* Révélation : les deux mots côte à côte, puis les deux encres qui se rejoignent ou non.
   Tout doit tenir au-dessus de la rangée de boutons sur un petit téléphone, d'où les cartes compactes. */
.onde-pair { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0.6rem; }
.onde-pair .g-card { justify-content: flex-start; gap: 0.5rem; min-height: 0; padding: 0.9rem; }
.onde-pair .g-who { padding: 0; background: none; }
/* Une demi-carte est étroite : le mot rétrécit un peu et, s'il le faut, se coupe entre deux syllabes. */
.onde-pair .g-card-text { font-size: clamp(1.1rem, 4.6vw, 1.6rem); -webkit-hyphens: auto; hyphens: auto; }
.onde-venn { display: flex; justify-content: center; }
.onde-venn .venn { max-width: 8rem; }
/* Le verdict tient sur une ligne, même sur le plus étroit des téléphones. */
.onde-verdict { font-size: clamp(1.55rem, 6vw, 2.4rem); }
/* La question et son bouton l'un sous l'autre : le bouton ne change pas de place quand le texte change. */
.onde-ask { display: flex; flex-direction: column; align-items: flex-start; }
.onde-ask .link { display: inline-flex; align-items: center; min-height: 44px; }
/* « Manche suivante » est inerte une demi-seconde (double toucher sur « Valider ») : cela ne doit pas se voir. */
.onde .g-actions .btn:disabled { opacity: 1; }
/* Écran court (petit téléphone, barres du navigateur comprises) : on resserre, pour que la question et son
   bouton restent au-dessus de la rangée de boutons. */
@media (max-height: 620px) {
  .game > .onde { gap: 0.75rem; }
  .onde-venn .venn { max-width: 6rem; }
}
.onde .g-big span { font-size: 0.42em; font-weight: 600; letter-spacing: 0; color: var(--muted); }
@media (prefers-reduced-motion: no-preference) {
  .onde-pair.is-new .g-card { animation: onde-in 0.3s ease-out backwards; }
  .onde-pair.is-new .g-card.b { animation-delay: 0.12s; }
  @keyframes onde-in { from { opacity: 0.3; transform: translateY(8px); } }
}

/* Récapitulatif des dix manches */
.onde-list { display: flex; flex-direction: column; }
.onde-list li { display: grid; grid-template-columns: auto minmax(0, 1fr); align-items: start; gap: 0.15rem 0.7rem; padding-block: 0.7rem; border-top: 1px solid var(--line); }
.onde-list .st { grid-row: 1 / 3; padding-top: 0.1rem; }
.onde-theme { font-size: 0.88rem; color: var(--muted); }
.onde-words { display: flex; flex-wrap: wrap; gap: 0.2rem 1.1rem; font-weight: 600; color: var(--ink); overflow-wrap: anywhere; }
.onde-words > span { display: inline-flex; align-items: center; gap: 0.4rem; min-width: 0; }
/* Le paquet qu'on vient de jouer, repéré comme le choix en cours sur la présentation. */
.onde .g-choice[aria-current="true"] { border-color: var(--ink); background: var(--wash); }

/* Le débat idiot. */
/* Un prénom de vingt lettres sans espace se coupe plutôt que de pousser la page en largeur. */
.debat { flex: 1 1 auto; display: flex; flex-direction: column; gap: 1rem; overflow-wrap: anywhere; }
.debat-step { font: 600 0.78rem var(--body); letter-spacing: 0.07em; text-transform: uppercase; color: var(--muted); }
.debat-motion { font-size: 1.05rem; color: var(--ink-2); text-wrap: pretty; }
/* Deux boutons côte à côte : même sur un petit écran, leur texte tient sur une ligne. */
.debat .g-actions .btn { padding-inline: 0.9rem; }

/* Annonce : le sujet sur sa carte, puis le camp imposé à chacun, dans son encre.
   Sur deux téléphones, un liseré marque le mien. */
.debat-topic { min-height: min(12rem, 30vh); }
.debat-sides { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0.6rem; }
.debat-side { display: flex; flex-direction: column; align-items: flex-start; gap: 0.3rem; min-width: 0; padding: 0.85rem 1rem; border-radius: 16px; background: var(--who-soft); }
.debat-side.me { box-shadow: inset 0 0 0 2px var(--who); }
.debat-side b { font: 700 1.5rem/1.1 var(--display); letter-spacing: -0.02em; }
.debat-side .g-who, .debat .g-score .g-who { padding: 0; background: none; }

/* Temps de parole : qui parle, dans son encre, et un chrono lisible à bout de bras.
   L'anneau part du haut et s'efface dans le sens des aiguilles d'une montre. */
.game .debat .debat-speaker { color: var(--who); }
.debat-clock { position: relative; align-self: center; width: min(100%, 17rem, 40vh); }
.debat-clock svg { display: block; width: 100%; height: auto; transform: scaleX(-1) rotate(-90deg); }
.debat-track, .debat-ring { fill: none; stroke-width: 7; }
.debat-track { stroke: var(--who-soft); }
.debat-ring { stroke: var(--who); stroke-linecap: round; stroke-dasharray: 339.3; }
.debat-num { position: absolute; inset: 0; display: grid; place-items: center; font-size: clamp(4rem, min(34vw, 20vh), 8.5rem); }
.debat-over { font-weight: 600; color: var(--ink); }

/* Fin du temps : un éclair de l'encre de qui parlait, par-dessus toute la page.
   Sans animation, c'est un cadre qui apparaît puis disparaît. */
.debat-flash { position: fixed; inset: 0; z-index: 9; pointer-events: none; box-shadow: inset 0 0 0 0.7rem var(--who); }
@media (prefers-reduced-motion: no-preference) {
  .debat-ring { transition: stroke-dashoffset 0.2s linear; }
  .debat-flash { background: var(--who); box-shadow: none; animation: debat-flash 0.8s ease-out both; }
  @keyframes debat-flash { from { opacity: 0.7; } to { opacity: 0; } }
  .debat-topic, .debat-cast p { animation: debat-in 0.3s ease-out backwards; }
  .debat-cast p + p { animation-delay: 0.12s; }
  @keyframes debat-in { from { opacity: 0.3; transform: translateY(8px); } }
}

/* Vote : trois grands boutons dans la page, loin de la rangée du bas où se trouvait « J'ai fini » */
.debat-picks { display: flex; flex-direction: column; gap: 0.55rem; }
.debat-pick {
  display: flex; align-items: center; gap: 0.7rem; width: 100%; min-height: 3.75rem; padding: 0.8rem 1.1rem;
  border: 1.5px solid var(--line); border-radius: 16px; background: var(--surface); color: var(--ink);
  font-size: 1.1rem; text-align: left; cursor: pointer; transition: border-color 0.12s, background 0.12s;
}
.debat-pick:hover { border-color: var(--who); background: var(--who-soft); }
.debat-pick:focus-visible { outline-color: var(--who); }
.debat-pick b { min-width: 0; font-weight: 600; }
.debat-pick span { flex: none; margin-left: auto; font-size: 0.85rem; color: var(--muted); }

/* Verdict : le score, la case de qui vient de gagner dans son encre, puis qui a voté pour qui */
.debat-cast { display: flex; flex-direction: column; gap: 0.45rem; }
.debat-cast p { display: flex; flex-wrap: wrap; align-items: center; gap: 0.3rem 0.6rem; color: var(--ink); }
.debat .g-score .debat-won { border-color: transparent; background: var(--who-soft); }

/* Récapitulatif des débats */
.debat-list { display: flex; flex-direction: column; }
.debat-list li { display: flex; flex-direction: column; align-items: flex-start; gap: 0.45rem; padding-block: 0.8rem; border-top: 1px solid var(--line); }

/* Les cartes à piocher. */
/* Une colonne plus étroite que la page : sur un grand écran, la carte garde des proportions de carte.
   Chaque écran du jeu descend jusqu'au bas de l'écran (4rem : l'en-tête du jeu et la marge du haut, à un ou deux
   pixels près, en trop plutôt qu'en moins) : la rangée de boutons reste collée en bas, au même endroit d'une carte
   à l'autre et d'un écran à l'autre, et « Arrêter la partie » passe en dessous, hors de portée d'un toucher de trop. */
.cartes { flex: 1 1 auto; display: flex; flex-direction: column; gap: 1rem; width: 100%; max-width: 30rem; min-height: calc(100vh - 4rem); min-height: calc(100dvh - 4rem); margin-inline: auto; }
.cartes-step { display: flex; align-items: baseline; justify-content: space-between; gap: 1rem; font: 600 0.78rem var(--body); letter-spacing: 0.07em; text-transform: uppercase; color: var(--muted); }
.cartes-count { flex: none; font-variant-numeric: tabular-nums; }
/* « changer » garde l'allure de la ligne. Sa zone de toucher de 44 px déborde autour du mot sans le grossir,
   pour que le contour du focus reste au bord du mot. */
.cartes-step .link { position: relative; padding: 0; font-size: inherit; letter-spacing: inherit; text-transform: inherit; color: inherit; }
.cartes-step .link::after { content: ""; position: absolute; inset: -0.95rem -0.6rem; }
/* En attendant l'autre : un prénom long et sans césure passe à la ligne au lieu d'élargir la page. */

/* La pile : tant qu'il reste des cartes à piocher, deux d'entre elles dépassent sous celle du dessus, une par encre.
   Elles ne se mélangent pas comme ailleurs : la carte qui glisse découvrirait un instant leur recouvrement, trop sombre ou trop clair. */
.cartes-stack { position: relative; flex: 1 1 auto; display: flex; margin: 0.6rem; isolation: isolate; }
.cartes-stack::before, .cartes-stack::after { content: ""; position: absolute; inset: 0; z-index: -1; border-radius: 22px; }
.cartes-stack::before { background: var(--a); transform: rotate(-2.2deg); }
.cartes-stack::after { background: var(--b); transform: rotate(1.8deg); }
.cartes-stack[data-left="0"]::before, .cartes-stack[data-left="0"]::after, .cartes-stack[data-left="1"]::after { content: none; }

/* La carte du dessus : l'encre de la personne à qui elle s'adresse, neutre quand elle est pour les deux.
   Sur deux téléphones, un liseré marque celles qui sont pour moi. Le navigateur garde le défilement
   vertical et le zoom à deux doigts ; le glissement de côté revient au jeu. */
.cartes-card { flex: 1 1 auto; justify-content: flex-start; min-width: 0; min-height: 0; padding: 1.3rem 1.4rem 2rem; touch-action: pan-y pinch-zoom; }
.cartes-card.me { border-color: var(--who); box-shadow: inset 0 0 0 1px var(--who); }
.cartes-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 0.6rem; }
.cartes-for { display: inline-flex; align-items: baseline; gap: 0.5rem; min-width: 0; font-weight: 600; line-height: 1.35; color: var(--ink); overflow-wrap: anywhere; }
.cartes-inks { flex: none; display: inline-flex; isolation: isolate; }
.cartes-inks .sw { mix-blend-mode: var(--blend); }
.cartes-inks .sw + .sw { margin-left: -0.25rem; }
.cartes-card .g-tag { flex: none; margin-top: 0.05rem; background: var(--surface); }
.cartes-card[data-t="d"] .g-tag { background: var(--btn); color: var(--btn-fg); }
.cartes-card[data-t="2"] .g-tag { background: var(--wash); }
.cartes-text { margin-block: auto; font-size: clamp(1.55rem, 7.4vw, 2.3rem); line-height: 1.14; }
.cartes-text.long { font-size: clamp(1.3rem, 5.6vw, 1.75rem); line-height: 1.2; }

   les cartes du dessous se verraient au travers. */
@media (prefers-reduced-motion: no-preference) {
  .cartes-card.next, .cartes-card.back { animation: cartes-in 0.26s cubic-bezier(0.2, 0.8, 0.3, 1); }
  .cartes-card.back { --from: -1; }
  @keyframes cartes-in { from { transform: translateX(calc(var(--from, 1) * 1.1rem)) rotate(calc(var(--from, 1) * 1.2deg)); } }
}

/* « Précédente » reste discrète : toute la largeur qui reste va à la carte suivante, sous le pouce. */
.cartes .g-actions .btn { padding-inline: 1rem; }
.cartes .g-actions .btn.alt { flex: 0 1 auto; }

/* Choix d'un paquet (fin du paquet, changement en route) : une page comme les autres, sur toute la colonne. */
.cartes-end { max-width: none; gap: 1.1rem; padding-top: 1rem; }
.cartes-end .g-choice[aria-pressed="true"] .g-tag { background: var(--surface); }

/* Écran moins haut : sur le choix d'un paquet, l'emblème laisse sa place aux paquets, qui tiennent ainsi au-dessus de la rangée du bas. */
@media (max-height: 44rem) {
  .cartes-end .glyph { display: none; }
}
/* Écran bas (petit téléphone, téléphone couché) : les marges se resserrent et le texte de la carte suit aussi la hauteur,
   pour que la carte entière tienne au-dessus des boutons au lieu de passer dessous. */
@media (max-height: 36rem) {
  .cartes:not(.cartes-end) { gap: 0.5rem; max-width: 40rem; }
  .cartes-stack { margin: 0.3rem 0.6rem; }
  .cartes-card { gap: 0.4rem; padding: 0.7rem 1.2rem 0.9rem; }
  .cartes-text { font-size: clamp(1.2rem, min(7.4vw, 7vh), 1.75rem); }
  .cartes-text.long { font-size: clamp(1.1rem, min(6.5vw, 4vh), 1.4rem); }
  .cartes .g-actions { padding-block: 0.4rem max(0.4rem, env(safe-area-inset-bottom, 0px)); }
  .cartes-end { gap: 0.7rem; padding-top: 0.25rem; }
}

/* Dessine-moi. */
.dessin { flex: 1 1 auto; display: flex; flex-direction: column; gap: 0.8rem; }
/* Un prénom ou un mot sans espace passe à la ligne au lieu de faire défiler la page de côté. */
.dessin .g-title, .dessin .g-lead, .dessin .hint, .dessin .sync, .dessin .g-pass h1, .dessin .g-pass p, .dessin .g-pass .btn { overflow-wrap: anywhere; }
.dessin-step { font: 600 0.78rem var(--body); letter-spacing: 0.07em; text-transform: uppercase; color: var(--muted); }
.dessin-who { display: flex; align-items: center; gap: 0.5rem; font-size: 0.95rem; color: var(--ink-2); }

/* Écran de dessin : sujet, chrono, feuille et outils tiennent ensemble à l'écran. Sur un petit téléphone,
   c'est la feuille qui rétrécit plutôt que de pousser les outils hors de portée du pouce. */
.dessin-head, .dessin-tools { width: 100%; max-width: 30rem; margin-inline: auto; }
.dessin-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 1rem; }
.dessin-subject { min-width: 0; font: 700 clamp(1.2rem, 5vw, 1.5rem)/1.15 var(--display); letter-spacing: -0.02em; text-wrap: balance; overflow-wrap: anywhere; }
.dessin-time { flex: none; font: 700 1.25rem/1.15 var(--body); font-variant-numeric: tabular-nums; color: var(--ink); }
.dessin-time.is-late { color: var(--crit); }
.dessin-desk { display: flex; flex-direction: column; gap: 0.4rem; width: min(100%, max(12rem, calc(100vh - 20.25rem))); width: min(100%, max(12rem, calc(100dvh - 20.25rem))); margin-inline: auto; }
.dessin-clock span { transition: none; }
/* La feuille reste blanche dans les deux thèmes, comme les encres restent fixes : un dessin doit être le même
   sur les deux téléphones et dans l'image enregistrée. Elle est cerclée de l'encre de son auteur. */
.dessin-sheet, .dessin-art { display: block; width: 100%; height: auto; border-radius: 14px; background: #fff; box-shadow: 0 0 0 2px var(--who); }
.dessin-sheet { touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; cursor: crosshair; }

.dessin-tools { display: flex; flex-direction: column; gap: 0.35rem; }
.dessin-row { display: flex; align-items: center; justify-content: space-between; }
/* Seconde rangée : des parts fixes, sur une seule ligne. « Tout effacer ? » passe à la ligne dans son bouton
   au lieu de le déplacer : le second toucher doit tomber là où était le premier. */
.dessin-row + .dessin-row { gap: 0.35rem; }
.dessin-sizes { display: flex; gap: 0.35rem; }
.dessin-pick { flex: 0 1 44px; display: grid; place-items: center; min-width: 0; height: 44px; padding: 0; border: 1.5px solid var(--line); border-radius: 12px; background: var(--surface); color: var(--ink); cursor: pointer; }
.dessin-sizes .dessin-pick { flex: none; width: 44px; }
.dessin-pick:hover, .dessin-do:hover { border-color: var(--ink); }
.dessin-pick[aria-pressed="true"] { border-color: var(--ink); background: var(--wash); }
.dessin-pick svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.dessin-dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.dessin-pick[data-v="1"] .dessin-dot { width: 16px; height: 16px; }
/* Une encre : une pastille bordée de blanc de papier, pour rester lisible sur fond sombre. */
.dessin-ink, .dessin-ink[aria-pressed="true"] { border: 0; border-radius: 50%; background: none; }
.dessin-ink::before { content: ""; width: 30px; height: 30px; border: 2px solid #fff; border-radius: 50%; background: var(--c); box-shadow: 0 0 0 1px var(--line); }
.dessin-ink[aria-pressed="true"]::before { box-shadow: 0 0 0 2px var(--bg), 0 0 0 4.5px var(--ink); }
.dessin-do { flex: 1 1 0; min-width: 0; min-height: 44px; padding: 0 0.4rem; border: 1.5px solid var(--line); border-radius: 999px; background: var(--surface); color: var(--ink); font-size: 0.92rem; font-weight: 600; line-height: 1.1; cursor: pointer; }
.dessin-do[data-act="clear"] { flex-grow: 1.3; }
/* La feuille est taillée pour un sujet sur deux lignes. Là où il en prend souvent trois (téléphone étroit, ou
   grand écran et ses caractères plus gros), elle cède une ligne : les outils ne passent pas sous « J'ai fini ». */
@media (max-width: 22.4rem) {
  .dessin-desk { width: min(100%, max(12rem, calc(100vh - 21.75rem))); width: min(100%, max(12rem, calc(100dvh - 21.75rem))); }
}
@media (min-width: 30rem) {
  .dessin-desk { width: min(100%, max(12rem, calc(100vh - 21.25rem))); width: min(100%, max(12rem, calc(100dvh - 21.25rem))); }
}
/* En dessous de 340 px, sept outils de 44 px ne tiennent plus : la rangée emprunte dix pixels à chaque marge de la page. */
@media (max-width: 21.2rem) {
  .dessin-tools { width: auto; margin-inline: -0.625rem; }
}

@media (max-height: 33.7rem) {
  .dessin-draw .g-actions { position: static; }
}
/* Téléphone tenu en largeur : la feuille à gauche, sur toute la hauteur ; le sujet, les outils et « J'ai fini » à droite. */
@media (orientation: landscape) and (max-height: 33.7rem) and (min-width: 35rem) {
  .dessin-draw { display: grid; grid-template: auto auto 1fr / auto minmax(0, 1fr); column-gap: 1rem; }
  .dessin-draw .dessin-desk { grid-area: 1 / 1 / -1; width: max(12rem, calc(100vh - 5.5rem)); width: max(12rem, calc(100dvh - 5.5rem)); margin: 0; }
  .dessin-draw .g-actions { align-self: end; padding-bottom: 0; }

/* Révélation et attente */
.dessin-pair { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0.7rem; }
/* Les feuilles s'alignent par le bas : un long prénom qui passe sur deux lignes ne décale pas son dessin. */
.dessin-fig figcaption { display: flex; flex-wrap: wrap; align-items: center; gap: 0.4rem; max-width: 100%; font-size: 0.9rem; color: var(--ink-2); }
.dessin-fig { display: flex; flex-direction: column; align-items: flex-start; justify-content: flex-end; gap: 0.5rem; min-width: 0; margin: 0; }
.dessin-mine { width: min(100%, 15rem); margin-inline: auto; }
.dessin-keep { display: flex; justify-content: center; }
.dessin-keep .btn { min-height: 44px; }
/* « Rejouer avec » : la catégorie qu'on vient de jouer, repérée comme le choix en cours sur la présentation. */
.dessin .g-choice[aria-current="true"] { border-color: var(--ink); background: var(--wash); }
@media (prefers-reduced-motion: no-preference) {
  .dessin-clock span { transition: width 0.25s linear; }
  .dessin-pair.is-new .dessin-fig { animation: dessin-in 0.3s ease-out backwards; }

  @keyframes dessin-in { from { opacity: 0.3; transform: translateY(8px); } }
}

/* Galerie, sur la présentation du jeu et à la fin d'une pile */
.dessin-gal { padding-block: 0.2rem; }
.dessin-gal summary { padding-block: 0.6rem; }
.dessin-gal .link { min-height: 44px; }
.dessin-thumbs { display: grid; grid-template-columns: repeat(auto-fill, minmax(9.5rem, 1fr)); gap: 0.6rem; }
.dessin-thumb { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); align-content: start; gap: 0.5rem; min-width: 0; padding: 0.6rem; border: 1px solid var(--line); border-radius: 14px; background: var(--surface); color: var(--ink-2); font-size: 0.82rem; line-height: 1.3; text-align: left; cursor: pointer; }
.dessin-thumb:hover { border-color: var(--ink); }
.dessin-thumb span { grid-column: 1 / -1; overflow-wrap: anywhere; }
.dessin-thumb .dessin-art { border-radius: 8px; box-shadow: 0 0 0 1.5px var(--a); }
.dessin-thumb .dessin-art + .dessin-art { box-shadow: 0 0 0 1.5px var(--b); }

/* Qui de nous deux ? (le jeu) */
.quiest { flex: 1 1 auto; display: flex; flex-direction: column; gap: 1rem; }
.quiest .g-title, .quiest .g-lead, .quiest .hint, .quiest .sync, .quiest-q { overflow-wrap: anywhere; }
.quiest-step { font: 600 0.78rem var(--body); letter-spacing: 0.07em; text-transform: uppercase; color: var(--muted); }
.quiest-who { display: flex; flex-wrap: wrap; align-items: center; gap: 0.3rem 0.5rem; font-size: 0.95rem; color: var(--ink-2); }
.quiest .g-who { background: var(--who-soft); }
.quiest-shh { flex-basis: 100%; font-size: 0.85rem; color: var(--muted); }

/* La question, grande, dans l'encre douce de qui répond. */
.quiest-card { display: flex; align-items: center; min-height: 9.5rem; padding: 1.4rem 1.3rem; border-radius: 22px; background: var(--who-soft); }
.quiest-card .g-title { font-size: clamp(1.6rem, 6.6vw, 2.3rem); }

.quiest-answers { position: sticky; bottom: 0; z-index: 2; display: flex; flex-direction: column; gap: 0.55rem; margin-top: auto;
  padding-block: 0.6rem max(0.6rem, env(safe-area-inset-bottom, 0px)); background: linear-gradient(to top, var(--bg) 80%, transparent); }
.quiest-names { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0.6rem; }
.quiest-pick { display: flex; align-items: center; justify-content: center; gap: 0.55rem; min-width: 0; min-height: 4.6rem; padding: 0.6rem 0.8rem; border: 0; border-radius: 18px;
  background: var(--a); color: var(--on-fill); font: 700 clamp(1rem, 5.2vw, 1.25rem)/1.15 var(--body); cursor: pointer; }
.quiest-pick.b { background: var(--b); }
/* Un prénom long passe à la ligne entre deux syllabes plutôt qu'au milieu d'une lettre près. */
.quiest-pick span { min-width: 0; overflow-wrap: break-word; -webkit-hyphens: auto; hyphens: auto; }
.quiest-pick .sw { width: 0.8rem; height: 0.8rem; background: var(--on-fill); }
.quiest-alt { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0.6rem; }
.quiest-small { min-height: 44px; padding: 0.4rem 0.8rem; border: 1.5px solid var(--line); border-radius: 14px; background: var(--surface); color: var(--ink); font: 600 0.95rem var(--body); cursor: pointer; }
.quiest-small:hover { border-color: var(--ink); }
.quiest-pick:focus-visible, .quiest-small:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
.quiest-back { align-self: center; font-size: 0.88rem; color: var(--muted); }
@media (hover: hover) { .quiest-pick:hover { filter: brightness(1.06); } }
@media (prefers-reduced-motion: no-preference) {
  .quiest-card.is-new { animation: quiest-in 0.22s ease-out; }
  @keyframes quiest-in { from { opacity: 0.2; transform: translateX(14px); } }
  .quiest-pick:active, .quiest-small:active { transform: scale(0.97); }
}
/* Écran court : la question et les réponses tiennent sans défiler. */
@media (max-height: 620px) {

}

.quiest-venn { display: flex; justify-content: center; }
.quiest-venn .venn { max-width: 8rem; }
.quiest .g-big span { font-size: 0.42em; font-weight: 600; letter-spacing: 0; color: var(--muted); }

/* Résultat : d'abord les accords, puis les deux versions des faits. */
.quiest-h { display: flex; align-items: center; gap: 0.5rem; margin-top: 0.6rem; font: 700 1.15rem/1.2 var(--display); color: var(--ink); }
.quiest-h span { display: grid; place-items: center; min-width: 1.6rem; height: 1.6rem; padding: 0 0.4rem; border-radius: 999px; background: var(--wash); font: 700 0.85rem var(--body); font-variant-numeric: tabular-nums; }
.quiest-list { display: flex; flex-direction: column; }
.quiest-row { display: flex; flex-direction: column; gap: 0.45rem; padding-block: 0.75rem; border-top: 1px solid var(--line); }
.quiest-q { font-weight: 600; color: var(--ink); }
.quiest-two { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0.5rem; }
.quiest-say { display: flex; flex-direction: column; align-items: flex-start; gap: 0.3rem; min-width: 0; }
.quiest-by { display: inline-flex; align-items: center; gap: 0.35rem; max-width: 100%; font-size: 0.78rem; color: var(--muted); overflow-wrap: anywhere; }
.quiest-by .sw { width: 0.5rem; height: 0.5rem; }
.quiest-chip { display: inline-flex; align-items: center; gap: 0.4rem; max-width: 100%; padding: 0.25rem 0.7rem; border-radius: 999px; background: var(--wash); color: var(--ink); font-size: 0.9rem; font-weight: 600; overflow-wrap: anywhere; }
.quiest-chip.a { background: var(--a-soft); }
.quiest-chip.b { background: var(--b-soft); }
.quiest-tag { white-space: normal; }
.quiest .g-choice[aria-current="true"] { border-color: var(--ink); background: var(--wash); }

/* L'histoire à quatre mains. */
.histoire { flex: 1 1 auto; display: flex; flex-direction: column; gap: 1rem; }
/* Une phrase sans espace (ou un prénom très long) passe à la ligne au lieu de faire défiler la page de côté. */

.histoire-step { font: 600 0.78rem var(--body); letter-spacing: 0.07em; text-transform: uppercase; color: var(--muted); }
.histoire .progress { margin-top: -0.5rem; }
.histoire-who { display: flex; align-items: center; gap: 0.5rem; font-size: 0.95rem; color: var(--ink-2); }
.histoire .g-who { background: var(--who-soft); }

/* La phrase à continuer : une carte compacte, pour que le champ reste au-dessus du clavier. */

.histoire-by .g-who { padding: 0; background: none; }

@media (max-height: 620px) {
  .game > .histoire { gap: 0.7rem; }
  .histoire-start { font-size: 0.85rem; line-height: 1.35; }

        '</ul><p><button class="link" type="button" data-act="vider">Vider la liste</button></p></details>' : "";
    },
    extraAct(k, name, el) {
      if (name === "fait") fait(k, el);
      else if (name === "vider" && sure(el, "Toucher encore pour tout effacer")) {
        /* Mise à jour sur place : un réaffichage ferait disparaître le bloc sans un mot, et le focus avec lui. */
        const box = el.closest("[data-extra]");
        k.store.del(LIST);
        box.innerHTML = '<p class="hint" role="status" tabindex="-1">La liste est vide.</p>';
        box.firstChild.focus();
      }
    }
  });
})();
</script>

<script>
/* Sur la même longueur d'onde : un thème, un mot chacun sans se concerter, dix manches.
   Tranche d'un joueur : { w: [mot de la manche 0, mot de la manche 1, …], ok: { "3": 1 }, fin: 1 }.
   - ok compte, manche par manche, les fois où le couple a contredit le verdict du jeu (« On compte
     quand même », « Finalement non »). Le plus grand des deux compteurs décide : impair, le verdict
     est inversé. Chacun n'écrit que le sien, donc deux décisions prises au même instant, sur la même
     manche ou sur deux manches, ne s'écrasent jamais.
   - fin : ce joueur a vu le résultat. Sur deux téléphones, on ne relance que lorsque les deux l'ont vu.
   Réglages : pack, puis, après un « Rejouer », deck (la seed de la première partie) et at (où en est
   chaque paquet), pour ne pas resservir les thèmes qu'on vient de voir.
   Chaque appareil avance à son rythme d'une révélation à la suivante (g.local.r), mais une manche
   ne se révèle que lorsque les deux mots sont là. */
(function () {
  "use strict";

  const DATA = (window.GAME_DATA && window.GAME_DATA.onde) || { packs: [] };
  const ROUNDS = 10;
  const MIX = [["classique", 4], ["nous", 4], ["absurde", 2]];
  const LEVELS = [
    [9, "Télépathie confirmée."],
    [7, "Presque la même fréquence."],
    [5, "Bonne réception."],
    [3, "Ça capte par moments."],
    [0, "Deux planètes, et c'est très bien comme ça."]
  ];
  const pack = (id) => DATA.packs.find((p) => p.id === id);
  /* Un entier borné lu dans un objet venu de l'autre téléphone (ou restauré depuis le relais) : sinon 0. */
  const int = (o, key) => { const n = o && typeof o === "object" ? o[key] : 0; return Number.isInteger(n) && n > 0 && n < 1e6 ? n : 0; };
  const seedOf = (g) => Number(g.setup.seed) || 1;
  const token = (g) => g.gen + ":" + g.setup.seed;

  /* Deux réponses comptent pour la même si elles ne diffèrent que par la casse, les accents, les
     articles en tête, le pluriel ou une faute de frappe. */
  const ARTICLE = /^(?:le|la|les|l|un|une|des|du|de|d|a|au|aux|mon|ma|mes|ton|ta|tes|son|sa|ses|notre|nos|votre|vos|leur|leurs)$/;
  /* Un mot : des lettres ou des chiffres, dans n'importe quelle écriture. Passé par RegExp() pour qu'un
     navigateur qui ignore \p{…} garde le jeu, en alphabet latin, au lieu de rejeter tout le fichier. */
  let WORD = /[a-z0-9]+/g;
  try { WORD = new RegExp("[\\p{L}\\p{N}][\\p{L}\\p{N}\\p{M}]*", "gu"); } catch (e) { /* alphabet latin seulement */ }
  function norm(s) {
    const t = s.toLowerCase().replace(/œ/g, "oe").replace(/æ/g, "ae").normalize("NFD").replace(/[\u0300-\u036f]/g, "").match(WORD) || [];
    while (t.length > 1 && ARTICLE.test(t[0])) t.shift();
    return t.map((w) => (w.length > 3 ? w.replace(/[sx]$/, "") : w)).join(" ");
  }
  function distance(a, b) {
    let prev = Array.from({ length: b.length + 1 }, (_, j) => j);
    for (let i = 1; i <= a.length; i++) {
      const cur = [i];
      for (let j = 1; j <= b.length; j++) cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
      prev = cur;
    }
    return prev[b.length];
  }
  /* 2 : le même mot. 1 : le même à une faute de frappe près (le couple peut le refuser). 0 : deux mots. */
  function same(a, b) {
    const raw = (s) => s.normalize("NFC").trim().toLowerCase();
    /* Deux réponses identiques comptent toujours, même faites d'un emoji ou de signes. */
    if (raw(a) === raw(b)) return 2;
    const x = norm(a), y = norm(b);
    if (!x || !y) return 0;
    /* Un espace ou un trait d'union de plus ne fait pas un autre mot : « week-end », « weekend ». */
    if (x.replace(/ /g, "") === y.replace(/ /g, "")) return 2;
    /* La faute de frappe ne vaut que pour les lettres : « 22h30 » n'est pas « 23h30 ». */
    const digits = (s) => (s.match(/\d+/g) || []).join(" "), letters = (s) => s.replace(/[\d ]/g, "").length;
    const n = Math.min(letters(x), letters(y));
    return digits(x) === digits(y) && n >= 5 && distance(x, y) <= (n >= 9 ? 2 : 1) ? 1 : 0;
  }

  /* Ce que la partie prend dans chaque paquet. */
  const plan = (g) => (pack(g.setup.pack) ? [[g.setup.pack, ROUNDS]] : MIX);
  /* Les dix thèmes de la partie, tirés de la même façon sur les deux téléphones. Chaque paquet garde
     le même ordre d'une partie à la suivante (deck) et « Rejouer » y reprend où l'on s'était arrêté
     (at) : un thème ne revient qu'une fois son paquet épuisé. */
  function themes(g) {
    const k = g.kit, deck = Number(g.setup.deck) || seedOf(g);
    let list = [];
    plan(g).forEach(([id, n]) => {
      const p = pack(id), all = p ? k.shuffle(p.themes, deck + DATA.packs.indexOf(p)) : [];
      for (let i = 0; i < Math.min(n, all.length); i++) list.push(all[(int(g.setup.at, id) + i) % all.length]);
    });
    if (!pack(g.setup.pack)) list = k.shuffle(list, seedOf(g));
    const map = { a: k.nm("a"), b: k.nm("b"), de_a: k.de(k.nm("a")), de_b: k.de(k.nm("b")) };
    return list.map((t) => k.fill(t, map));
  }

  /* Les mots viennent parfois de l'autre téléphone : dix au plus, et seulement des chaînes courtes. */
  const words = (g, w) => (Array.isArray(g.S[w].w) ? g.S[w].w.slice(0, ROUNDS) : []).map((x) => (typeof x === "string" && x.trim() ? x.slice(0, 40) : null));
  const flips = (g, r) => Math.max(int(g.S.a.ok, r), int(g.S.b.ok, r));
  /* auto : le verdict du jeu. sure : mot pour mot le même, rien à discuter. flip : le couple a contredit le jeu. */
  function result(g, r) {
    const a = words(g, "a")[r], b = words(g, "b")[r];
    if (a == null || b == null) return null;
    const m = same(a, b), flip = m < 2 && flips(g, r) % 2 === 1;
    return { a, b, auto: m > 0, sure: m === 2, flip, ok: (m > 0) !== flip };
  }
  const score = (g, upTo) => { let n = 0; for (let r = 0; r < upTo; r++) { const x = result(g, r); if (x && x.ok) n++; } return n; };
  const done = (g) => { for (let r = 0; r < ROUNDS; r++) if (!result(g, r)) return false; return true; };
  const round = (g) => Math.min(Math.max(parseInt(g.local.r, 10) || 0, 0), ROUNDS);
  /* Qui doit écrire maintenant : moi sur deux téléphones ; sur un seul, celui qui n'a pas encore
     écrit, en alternant qui commence. Renvoie null quand les deux mots sont là. */
  function writer(g, r) {
    if (g.duo) return words(g, g.me)[r] == null ? g.me : null;
    const first = r % 2 ? "b" : "a", second = g.other(first);
    return words(g, first)[r] == null ? first : words(g, second)[r] == null ? second : null;
  }
  /* Relancer emmène l'autre téléphone dans la nouvelle partie : on attend qu'il ait vu le résultat de celle-ci. */
  const ready = (g) => !g.duo || !!g.S[g.other(g.me)].fin;
  /* Le record gardé sur l'appareil : { n, k, was }, k étant la partie qui l'a établi et was le record
     d'avant elle. Renvoie n et le record à battre : tant que la partie en cours est celle du record,
     son score peut encore bouger (un point accordé puis repris), c'est donc was qui compte. */
  function best(g) {
    const b = g.kit.store.get("onde:best", null), n = b && Number.isInteger(b.n) ? b.n : -1;
    return { n, was: n >= 0 && b.k === token(g) ? (Number.isInteger(b.was) ? b.was : -1) : n };
  }

  /* Haut d'écran : où l'on en est et, sur la révélation, le score (à droite, pour ne pas finir sous les boutons). */
  const top = (g, r, right) => '<div class="onde-top"><p class="onde-step">' + (!r && g.gen > 1 && !right ? "Nouvelle partie · " : "") + "Manche " + (r + 1) + " sur " + ROUNDS + "</p>" + (right || "") +
    '</div><div class="progress" role="progressbar" aria-label="Avancement" aria-valuemin="0" aria-valuemax="' + ROUNDS + '" aria-valuenow="' + r + '"><span style="width:' + (100 * r) / ROUNDS + '%"></span></div>';

  function vWrite(g, r, w, theme) {
    const k = g.kit, oth = k.nm(g.other(w));
    /* Sur un seul téléphone, qui écrit en second ouvre la révélation et garde l'appareil pour commencer la manche suivante. */
    const second = !g.duo && words(g, g.other(w))[r] != null;
    return '<div class="onde as-' + w + '" data-screen="ecrire-' + r + "-" + w + '">' + top(g, r) + '<p class="onde-who">' + k.who(w) + ' écrit</p><h1 class="g-title" tabindex="-1" data-focus>' + k.esc(theme) + "</h1>" +
      '<form class="onde-form"><input class="g-field" name="mot" data-keep="mot-' + g.gen + "-" + seedOf(g) + "-" + r + "-" + w + '" maxlength="40" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="done" placeholder="Ton mot" aria-label="' +
      k.esc(k.nm(w) + ", ton mot pour « " + theme + " »") + '"><p class="hint">' + k.esc("Un mot ou deux, sans rien dire à voix haute. " + oth +
        (second ? " a déjà écrit le sien : les deux mots s'affichent dès que tu valides." : " ne le verra qu'une fois le sien écrit." + (g.duo ? "" : " Ensuite, passe-lui le téléphone."))) + "</p>" +
      '<div class="g-actions"><button class="btn" type="submit">Valider</button></div></form></div>';
  }

  function vWait(g, r, theme) {
    const k = g.kit;
    return '<div class="onde as-' + g.me + '" data-screen="attente-' + r + '">' + top(g, r) + '<h1 class="g-title">' + k.esc(theme) + '</h1><p class="g-lead" tabindex="-1" data-focus>Tu as écrit\u00a0: <b>' + k.esc(words(g, g.me)[r]) + "</b></p>" +
      k.wait(g, "En attente du mot " + k.de(k.nm(g.other(g.me))) + "…") + "</div>";
  }

  function vReveal(g, r, theme) {
    const k = g.kit, x = result(g, r);
    const cell = (w) => '<div class="g-card ' + w + '">' + k.who(w) + '<p class="g-card-text">' + k.esc(x[w]) + "</p></div>";
    /* data-on dit ce que le bouton veut obtenir : s'il change de sens sous le doigt, le toucher ne défait rien. */
    const ask = x.sure ? "" : '<div class="onde-ask"><p class="hint">' +
      (x.flip ? (x.auto ? "Vous avez décidé que ça ne comptait pas." : "Vous avez décidé que ça comptait.") : x.auto ? "Pas tout à fait le même mot\u00a0?" : "Deux façons de dire la même chose\u00a0?") +
      '</p><button class="link" type="button" data-act="force" data-on="' + (x.flip ? 0 : 1) + '">' + (x.flip ? (x.auto ? "Finalement si" : "Finalement non") : x.auto ? "On ne compte pas" : "On compte quand même") + "</button></div>";
    return '<div class="onde" data-screen="revele-' + r + '">' + top(g, r, '<p class="onde-score">Score\u00a0: <b>' + score(g, r + 1) + "</b> sur " + (r + 1) + "</p>") + '<p class="eyebrow">' + k.esc(theme) +
      '</p><div class="onde-pair">' + cell("a") + cell("b") + '</div><div class="onde-venn">' + k.venn(x.ok ? 100 : 0) + '</div><h1 class="g-title onde-verdict" tabindex="-1" data-focus>' + (x.ok ? "Même longueur d'onde." : "Pas cette fois.") + "</h1>" + ask +
      '<div class="g-actions"><button class="btn" type="button" data-act="next">' + (r === ROUNDS - 1 ? "Voir le résultat" : "Manche suivante") + "</button></div></div>";
  }

  function vEnd(g, list) {
    const k = g.kit, n = score(g, ROUNDS), was = best(g).was, cur = pack(g.setup.pack) ? g.setup.pack : "melange";
    const word = (x, w) => '<span><i class="sw ' + w + '"></i><span class="sr">' + k.esc(k.nm(w) + " : ") + "</span>" + k.esc(x[w]) + "</span>";
    const choice = (id, name) => '<button class="g-choice" type="button" data-act="again" data-pack="' + id + '"' + (cur === id ? ' aria-current="true"' : "") + "><b>" + k.esc(name) + "</b></button>";
    return '<div class="onde" data-screen="resultat"><p class="eyebrow">Résultat</p><div class="onde-venn">' + k.venn(10 * n) + '</div><p class="g-big">' + n + "<span> / " + ROUNDS + '</span></p><h1 class="g-title" tabindex="-1" data-focus>' +
      LEVELS.find((l) => n >= l[0])[1] + '</h1><p class="g-lead">' + (n > was ? "Nouveau record." : "Votre record\u00a0: " + was + " sur " + ROUNDS + ".") + '</p><ul class="onde-list">' + list.map((t, r) => {
        const x = result(g, r);
        return x ? '<li><span class="st ' + (x.ok ? "ok" : "gap") + '"><i aria-hidden="true">' + (x.ok ? "=" : "≠") + '</i><span class="sr">' + (x.ok ? "Pareil" : "Différent") + '</span></span><p class="onde-theme">' + k.esc(t) +
          '</p><p class="onde-words">' + word(x, "a") + word(x, "b") + "</p></li>" : "";
      }).join("") + "</ul>" + (ready(g)
        ? '<div class="g-opts"><p class="g-opts-label">Rejouer avec</p><div class="g-choices">' + choice("melange", "Mélange") + DATA.packs.map((p) => choice(p.id, p.name)).join("") + "</div></div>"
        : k.wait(g, "Vous pourrez rejouer dès " + k.que(k.nm(g.other(g.me))) + " aura vu le résultat.")) + "</div>";
  }

  /* La révélation à l'écran : quand elle est apparue, et quand la décision du couple y a changé pour la dernière fois. */
  let seen = { key: "", flip: false, at: 0, flipAt: 0 };

  (window.GAMES = window.GAMES || []).push({
    id: "onde",
    v: 1,
    title: "Sur la même longueur d'onde",
    hook: "Est-ce qu'on pense au même mot ?",
    blurb: "Un thème, un mot chacun, sans se concerter. Dix manches pour voir si vous captez la même fréquence.",
    meta: "10 manches · 5 min",
    intro: [
      "Un thème s'affiche : « Un fruit rouge », « Le plat qu'on commande le plus souvent ». Chacun écrit un mot sans rien dire. Si vous avez écrit le même, c'est gagné.",
      "Dix manches. Il ne s'agit pas de donner la meilleure réponse, mais de deviner celle que l'autre va écrire."
    ],
    glyph: '<path class="ring-a" d="M4 24q5-13 10 0t10 0 10 0 10 0"/><path class="ring-b" d="M4 24q5 13 10 0t10 0 10 0 10 0"/>',
    live: true,
    options: [{
      id: "pack", label: "Thèmes", def: "melange",
      choices: [{ id: "melange", name: "Mélange", hint: "Un peu de tout." }].concat(DATA.packs.map((p) => ({ id: p.id, name: p.name, hint: p.hint })))
    }],
    view(g) {
      const list = themes(g), r = round(g);
      /* Le fichier des thèmes n'est pas arrivé sur cet appareil : surtout pas de faux résultat, ni de « Rejouer ». */
      if (list.length < ROUNDS) return '<div class="onde" data-screen="vide"><h1 class="g-title" tabindex="-1" data-focus>Les thèmes ne sont pas arrivés.</h1><p class="g-lead">Recharge la page\u00a0: la partie reprendra où elle en était.</p></div>';
      if (r >= ROUNDS) return vEnd(g, list);
      const w = writer(g, r);
      if (w) return vWrite(g, r, w, list[r]);
      return result(g, r) ? vReveal(g, r, list[r]) : vWait(g, r, list[r]);
    },
    submit(g, form) {
      const r = round(g), w = r < ROUNDS && writer(g, r), field = form.querySelector("[name=mot]");
      const word = field ? field.value.trim().replace(/\s+/g, " ").slice(0, 40) : "";
      if (!w || !field) return;
      if (!word) { field.focus(); return; }
      const list = words(g, w);
      for (let i = 0; i <= r; i++) if (list[i] === undefined) list[i] = null;
      list[r] = word;
      g.set(w, { w: list });
    },
    act(g, name, el) {
      const r = round(g), x = r < ROUNDS ? result(g, r) : null;
      if (name === "next" && x) {
        g.local.r = r + 1;
        g.save();
        /* Dernière révélation sur deux téléphones : l'autre apprend que j'ai vu le résultat (un message, sur mon toucher). */
        if (g.duo && r === ROUNDS - 1 && !g.S[g.me].fin) g.set(g.me, { fin: 1 }); else g.render();
      } else if (name === "force" && x && !x.sure) {
        /* Rien à faire si c'est déjà décidé ainsi (l'autre vient de toucher le même bouton), ni dans la seconde
           qui suit un changement : le bouton vient de changer de sens, ce toucher visait l'ancien. */
        if (x.flip === (el.getAttribute("data-on") === "1") || Date.now() - seen.flipAt < 1000) return;
        const w = g.me || "a", ok = {};
        for (let i = 0; i < ROUNDS; i++) if (int(g.S[w].ok, i)) ok[i] = int(g.S[w].ok, i);
        ok[r] = flips(g, r) + 1;
        g.set(w, { ok });
      } else if (name === "again" && r >= ROUNDS && ready(g) && themes(g).length === ROUNDS) {
        const id = el.getAttribute("data-pack"), at = {};
        DATA.packs.forEach((p) => { at[p.id] = int(g.setup.at, p.id); });
        plan(g).forEach(([p, n]) => { at[p] = (at[p] + n) % pack(p).themes.length; });
        g.newGame({ pack: pack(id) ? id : "melange", deck: Number(g.setup.deck) || seedOf(g), at });
      }
    },
    over(g) { return round(g) >= ROUNDS; },
    mount(g, root) {
      const field = root.querySelector(".onde-form .g-field"), pair = root.querySelector(".onde-pair");
      let timer = null;
      /* Le clavier s'ouvre tout seul quand c'est possible (le navigateur l'exige dans un geste). */
      if (field && document.activeElement !== field) { try { field.focus({ preventScroll: true }); } catch (e) { /* sans importance */ } }
      if (pair) {
        const r = round(g), key = token(g) + ":" + r, flip = result(g, r).flip, now = Date.now(), next = root.querySelector('[data-act="next"]');
        /* Les deux cartes ne font leur entrée qu'à la première apparition de la révélation, pas à chaque réaffichage. */
        if (key !== seen.key) { seen = { key, flip, at: now, flipAt: 0 }; pair.classList.add("is-new"); }
        else if (flip !== seen.flip) { seen.flip = flip; seen.flipAt = now; }
        /* « Manche suivante » prend la place de « Valider » : pendant une demi-seconde il ne répond pas,
           sinon le second toucher d'un double toucher ferait sauter la révélation. */
        const wait = seen.at + 500 - now;
        if (wait > 0) { next.disabled = true; timer = setTimeout(() => { next.disabled = false; }, wait); }
      }
      /* Le record se note dès que les dix manches sont connues, même si cet appareil n'affiche pas (encore) le résultat. */
      if (done(g)) {
        const n = score(g, ROUNDS), b = best(g), high = Math.max(n, b.was);
        if (high !== b.n) g.kit.store.set("onde:best", { n: high, k: token(g), was: b.was });
      }
      return () => clearTimeout(timer);
    }
  });
})();
</script>
