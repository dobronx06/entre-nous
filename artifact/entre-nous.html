<script>
/* Le débat idiot : un sujet absurde, un camp imposé à chacun, un temps de parole chacun, puis le vote.
   État commun : { k, ph, by }, le rang du sujet dans la liste mélangée par la seed, sa phase : "sujet"
   (annonce), "pour" puis "contre" (temps de parole), "vote", "fin", et le joueur qui l'a lancée. Sur
   un seul téléphone, il porte aussi les verdicts, décidés ensemble : v: { "3": "a" }.
   Tranche d'un joueur (deux téléphones) : { v: { "3": "b" } }, son vote secret pour chaque sujet.
   Réglages de la manche : duree (30, 60 ou 90 secondes) et, après « Rejouer », vus : les sujets déjà
   passés à l'écran (leurs rangs dans le fichier), pour ne pas les resservir.
   Sur l'appareil, g.local.t = { k, ph, at, mine, z } : l'instant où CET appareil a vu la phase commencer
   (les horloges des deux téléphones ne sont jamais comparées), s'il l'a lancée lui-même (lui seul passe
   alors à la suite quand le temps est écoulé) et s'il a déjà signalé la fin du temps ; g.local.e =
   { n, at } : l'écran affiché et l'instant où il est apparu. Le score se déduit des votes, il n'est
   pas stocké. */
(function () {
  "use strict";

  const DATA = (window.GAME_DATA && window.GAME_DATA.debat) || {};
  const TOPICS = (Array.isArray(DATA.topics) ? DATA.topics : []).filter((t) => typeof t === "string" && t.trim());
  const PHASES = ["sujet", "pour", "contre", "vote", "fin"];
  const TIMES = { 30: "Trente secondes", 60: "Une minute", 90: "Une minute trente" };
  const HINTS = { 30: "Droit au but.", 60: "Le format classique.", 90: "Pour les grandes envolées." };
  /* Secondes laissées au téléphone qui a lancé le temps de parole pour passer à la suite, avant de proposer de le faire ici. */
  const GRACE = 3;
  /* Un toucher arrivé juste après un changement d'écran visait l'écran d'avant (« J'ai fini » à la dernière
     seconde, doigt impatient) : pendant ce délai, en millisecondes, il est ignoré. */
  const SETTLE = 600;
  /* Sous ce reste de chrono, en secondes, une phase que l'autre téléphone vient de clore s'est finie à zéro
     chez lui : ce n'est pas un « J'ai fini » touché en avance. */
  const NEAR = 1.5;
  const RING = 339.3; /* périmètre de l'anneau du chrono (rayon 54) */
  /* Le bouton qui avait le focus quand l'écran a été redessiné, pour le lui rendre s'il y est encore. */
  let kept = null;

  const seed = (g) => Number(g.setup.seed) || 1;
  /* L'ordre des sujets de la manche, le même sur les deux téléphones : ceux qu'on n'a pas encore vus, mélangés
     par la seed, puis les déjà vus, du plus ancien au plus récent. La liste des vus vient des réglages,
     donc parfois de l'autre téléphone : on n'en garde que des rangs valables, une fois chacun. */
  function order(g) {
    const seen = (Array.isArray(g.setup.vus) ? g.setup.vus.slice(0, TOPICS.length) : []).filter((i, j, a) => Number.isInteger(i) && i >= 0 && i < TOPICS.length && a.indexOf(i) === j);
    const fresh = TOPICS.map((t, i) => i).filter((i) => seen.indexOf(i) < 0);
    return { ids: g.kit.shuffle(fresh, seed(g)).concat(seen), fresh: fresh.length };
  }
  const topics = (g) => order(g).ids.map((i) => TOPICS[i]);
  /* La durée vient parfois de l'autre téléphone : hors des trois choix, une minute. */
  const dur = (g) => (TIMES.hasOwnProperty(g.setup.duree) ? Number(g.setup.duree) : 60);
  /* Pile ou face tiré de la seed et du rang du sujet : le même tirage sur les deux téléphones. */
  const pour = (g, k) => (g.kit.rng(seed(g) + 7919 * (k + 1))() < 0.5 ? "a" : "b");

  /* k et ph viennent parfois de l'autre téléphone : hors des valeurs connues, on reprend au début du sujet. */
  function state(g, n) {
    const k = Number.isInteger(g.sh.k) && g.sh.k >= 0 && g.sh.k < n ? g.sh.k : 0;
    return { k, ph: k === g.sh.k && PHASES.indexOf(g.sh.ph) > 0 ? g.sh.ph : "sujet" };
  }

  /* Un vote ne compte que s'il désigne l'un des deux joueurs ou l'égalité. */
  const okVote = (x) => x === "a" || x === "b" || x === "=";
  const pick = (o, k) => (o && typeof o === "object" && okVote(o[k]) ? o[k] : null);
  /* Les votes valables des sujets précédents, recopiés avant d'y ajouter celui du sujet k. */
  const votes = (o, k) => { const out = {}; for (let j = 0; j < k; j++) if (pick(o, j)) out[j] = pick(o, j); return out; };

  /* Verdict d'un sujet, null tant qu'il manque un vote. Sur un téléphone, il se décide ensemble. Sur deux,
     les deux votes secrets doivent désigner la même personne : sinon, personne ne gagne. */
  function verdict(g, k) {
    if (!g.duo) { const w = pick(g.sh.v, k); return w ? { w } : null; }
    const a = pick(g.S.a.v, k), b = pick(g.S.b.v, k);
    return a && b ? { w: a === b ? a : "=", a, b } : null;
  }
  /* Sujets débattus jusqu'au sujet k et points de chacun : tout se recalcule à partir des votes. */
  function tally(g, k) {
    const t = { rows: [], a: 0, b: 0 };
    for (let j = 0; j <= k; j++) { const x = verdict(g, j); if (x) { t.rows.push({ j, w: x.w }); if (x.w !== "=") t[x.w]++; } }
    return t;
  }

  /* Secondes restantes pour qui parle, comptées depuis l'instant où cet appareil a vu la phase commencer. */
  function left(g, st) {
    const t = g.local.t, now = Date.now();
    return dur(g) - (t && t.k === st.k && t.ph === st.ph && t.at <= now ? (now - t.at) / 1000 : 0);
  }
  /* Où en est le chrono : 0 il tourne, 1 temps écoulé, 2 écoulé depuis assez longtemps pour ne plus attendre personne. */
  const stage = (s) => (s <= -GRACE ? 2 : s <= 0 ? 1 : 0);

  const after = (ph) => (ph === "pour" ? "contre" : "vote");
  /* Change de sujet ou de phase pour les deux téléphones. Réservé aux gestes du joueur et à la fin d'un
     temps de parole lancé sur cet appareil : jamais en réaction à ce que l'autre vient d'envoyer.
     Si les deux lancent la même phase au même instant, le socle ne garde qu'un des deux états : « by »
     désigne alors un seul téléphone, celui qui enchaînera à la fin du temps. */
  function move(g, k, ph) {
    g.local.t = { k, ph, at: Date.now(), mine: 1 };
    g.share({ k, ph, by: g.me });
  }

  /* Fin du temps : vibration, bip, et un éclair de l'encre de qui parlait. L'éclair vit hors de l'écran
     de jeu, qui est redessiné au même instant pour la phase suivante. */
  function signal(g, w) {
    const el = document.createElement("div");
    el.className = "debat-flash as-" + w;
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 900);
    g.kit.buzz([200, 100, 200]);
    g.kit.beep();
  }

  const step = (g, k) => '<p class="debat-step">Débat ' + (tally(g, k - 1).rows.length + 1) + "</p>";
  const motion = (g, text) => '<p class="debat-motion">' + g.kit.esc(text) + ".</p>";
  const score = (g, t, won) => '<div class="g-score">' + ["a", "b"].map((w) => "<div" + (won === w ? ' class="debat-won as-' + w + '"' : "") + ">" + g.kit.who(w) + "<b>" + t[w] + "</b></div>").join("") + "</div>";

  function vTopic(g, list, k) {
    const kit = g.kit, p = pour(g, k), c = g.other(p), P = kit.nm(p), oth = g.duo ? g.other(g.me) : "";
    const side = (w, camp) => '<div class="debat-side as-' + w + (g.me === w ? " me" : "") + '">' + kit.who(w) + "<b>" + camp + "</b></div>";
    const lead = (!g.duo ? "Camps imposés, quoi que vous en pensiez : " + P + " ouvre le débat, " + kit.nm(c) + " répond."
      : g.me === p ? "Tu es pour, quoi que tu en penses : tu ouvres le débat." : "Tu es contre, quoi que tu en penses : " + P + " ouvre le débat, tu réponds.") + " " + TIMES[dur(g)] + " chacun.";
    return '<div class="debat" data-screen="sujet-' + k + '">' + step(g, k) + '<div class="g-card debat-topic"><h1 class="g-card-text" tabindex="-1" data-focus>' + kit.esc(list[k]) + ".</h1></div>" +
      '<div class="debat-sides">' + side(p, "Pour") + side(c, "Contre") + '</div><p class="g-lead">' + kit.esc(lead) + "</p>" +
      /* Le débat se joue en direct : pas de chrono pour quelqu'un qui n'a pas encore rejoint la partie. */
      (g.duo && !g.here(oth) ? kit.wait(g, "En attente " + kit.de(kit.nm(oth)) + "…")
        : '<div class="g-actions"><button class="btn" type="button" data-act="go">C\'est parti</button>' +
          (k < list.length - 1 ? '<button class="btn alt" type="button" data-act="skip">Autre sujet</button>' : "") + "</div>") + "</div>";
  }

  function vSpeak(g, list, st) {
    const kit = g.kit, k = st.k, w = st.ph === "pour" ? pour(g, k) : g.other(pour(g, k)), oth = kit.nm(g.other(w));
    const s = left(g, st), talk = !g.duo || g.me === w;
    const hint = s <= 0 ? "Temps écoulé." : !g.duo ? (st.ph === "pour" ? oth + " répond juste après." : "Ensuite, vous votez.")
      : talk ? "À toi de convaincre " + oth + "." : "Écoute " + kit.nm(w) + " sans l'interrompre.";
    /* Tant que le chrono tourne, seul qui parle peut l'arrêter. Une fois le temps largement écoulé, n'importe
       qui peut passer à la suite : le téléphone qui devait le faire est peut-être parti. */
    const btn = stage(s) === 2 ? "Passer à la suite" : s > 0 && talk ? "J'ai fini" : "";
    return '<div class="debat as-' + w + '" data-screen="' + st.ph + "-" + k + '">' + step(g, k) +
      '<h1 class="g-title debat-speaker" tabindex="-1" data-focus>' + kit.esc(kit.nm(w) + " plaide " + st.ph + ".") + "</h1>" +
      '<div class="debat-clock" role="timer" aria-label="Secondes restantes"><svg viewBox="0 0 120 120" aria-hidden="true"><circle class="debat-track" cx="60" cy="60" r="54"/>' +
      (s > 0 ? '<circle class="debat-ring" cx="60" cy="60" r="54" style="stroke-dashoffset:' + (RING * (1 - s / dur(g))).toFixed(1) + '"/>' : "") +
      '</svg><p class="g-big debat-num">' + Math.max(0, Math.ceil(s)) + "</p></div>" + motion(g, list[k]) + (s <= 0 ? '<p class="debat-over" role="status">' : '<p class="hint">') + kit.esc(hint) + "</p>" +
      (btn ? '<div class="g-actions"><button class="btn" type="button" data-act="done">' + btn + "</button></div>" : "") + "</div>";
  }

  function vVote(g, list, k) {
    const kit = g.kit, p = pour(g, k), oth = g.duo ? g.other(g.me) : "";
    if (g.duo && pick(g.S[g.me].v, k)) {
      return '<div class="debat" data-screen="attente-' + k + '">' + step(g, k) + motion(g, list[k]) + '<h1 class="g-title" tabindex="-1" data-focus>A voté.</h1>' +
        kit.wait(g, "En attente du vote " + kit.de(kit.nm(oth)) + "…") + "</div>";
    }
    const btn = (v, camp) => '<button class="debat-pick' + (camp ? " as-" + v : "") + '" type="button" data-act="vote" data-v="' + v + '">' +
      (camp ? '<i class="sw ' + v + '"></i><b>' + kit.esc(kit.nm(v)) + "</b><span>" + camp + "</span>" : "<b>Égalité</b>") + "</button>";
    return '<div class="debat" data-screen="vote-' + k + '">' + step(g, k) + motion(g, list[k]) + '<h1 class="g-title" tabindex="-1" data-focus>Qui a le mieux plaidé\u00a0?</h1>' +
      '<p class="g-lead">' + kit.esc(g.duo ? "Ton vote reste secret jusqu'à celui " + kit.de(kit.nm(oth)) + "." : "Mettez-vous d'accord, si c'est encore possible.") + "</p>" +
      '<div class="debat-picks">' + btn(p, "pour") + btn(g.other(p), "contre") + btn("=") + "</div>" +
      (g.duo && pick(g.S[oth].v, k) ? '<p class="hint">' + kit.esc(kit.nm(oth) + " a déjà voté.") + "</p>" : "") + "</div>";
  }

  function vVerdict(g, list, k, x) {
    const kit = g.kit, last = k >= list.length - 1, selfish = x.a === "a" && x.b === "b", polite = x.a === "b" && x.b === "a";
    const title = x.w !== "=" ? kit.nm(x.w) + " remporte ce débat." : selfish ? "Mauvaise foi partagée." : polite ? "Trop de politesse pour gagner." : "Égalité.";
    const lead = x.w !== "=" ? (g.duo ? "Même " + kit.nm(g.other(x.w)) + " le reconnaît." : "") : selfish ? "Chacun a voté pour soi : égalité."
      : polite ? "Chacun a voté pour l'autre : égalité." : x.a !== x.b ? "Vos votes ne concordent pas : personne ne marque." : "Personne ne l'emporte, d'un commun accord.";
    const cast = (w) => "<p>" + kit.who(w) + " " + kit.esc(x[w] === "=" ? "a voté égalité" : "a voté pour " + kit.nm(x[w])) + "</p>";
    /* Le score d'abord : sur un petit écran, c'est le détail des votes qui passe sous la rangée de boutons. */
    return '<div class="debat" data-screen="verdict-' + k + '">' + step(g, k) + motion(g, list[k]) + '<h1 class="g-title" tabindex="-1" data-focus>' + kit.esc(title) + "</h1>" +
      (lead ? '<p class="g-lead">' + kit.esc(lead) + "</p>" : "") + score(g, tally(g, k), x.w) + (g.duo ? '<div class="debat-cast">' + cast("a") + cast("b") + "</div>" : "") +
      '<div class="g-actions">' + (last ? "" : '<button class="btn" type="button" data-act="next">Sujet suivant</button>') +
      '<button class="btn' + (last ? "" : " alt") + '" type="button" data-act="end">' + (last ? "Voir le résultat" : "Terminer") + "</button></div></div>";
  }

  function vEnd(g, list, k) {
    const kit = g.kit, t = tally(g, k), n = t.rows.length, ties = n - t.a - t.b, w = t.a > t.b ? "a" : t.b > t.a ? "b" : "";
    return '<div class="debat" data-screen="fin"><p class="eyebrow">Résultat</p><h1 class="g-title" tabindex="-1" data-focus>' +
      kit.esc(!n ? "Aucun débat tranché." : w ? kit.nm(w) + " remporte la partie." : "Égalité parfaite.") + "</h1>" +
      (n ? '<p class="g-lead">' + kit.pl(n, "débat", "débats") + (ties ? ", dont " + ties + " sans vainqueur" : "") + ".</p>" : "") + score(g, t, w) +
      '<ul class="debat-list">' + t.rows.map((r) => "<li>" + motion(g, list[r.j]) + (r.w === "=" ? '<span class="g-tag">Égalité</span>' : kit.who(r.w)) + "</li>").join("") + "</ul>" +
      '<div class="g-actions"><button class="btn" type="button" data-act="again">Rejouer</button></div></div>';
  }

  (window.GAMES = window.GAMES || []).push({
    id: "debat",
    v: 1,
    title: "Le débat idiot",
    hook: "Qui de nous deux peut défendre n'importe quoi ?",
    blurb: "Un sujet absurde tombe et le site vous impose un camp, pour ou contre : chacun son temps de parole pour convaincre, puis vous votez.",
    meta: (TOPICS.length ? TOPICS.length + " sujets · " : "") + "3 min par débat",
    intro: [
      "Un sujet absurde tombe : « Un chat, ça se vouvoie ». Le site décide qui est pour et qui est contre, quoi que vous en pensiez vraiment.",
      "Chacun son tour, vous plaidez, chrono en main. Puis vous votez pour dire qui a le mieux plaidé. La mauvaise foi est permise, et même recommandée."
    ],
    glyph: '<path class="ink-a" d="M17 6a13 13 0 1 1-7.5 23.6L4 36l.4-13.6A13 13 0 0 1 17 6z"/><path class="ink-b" d="M24 18h16a4 4 0 0 1 4 4v22l-7-6H24a4 4 0 0 1-4-4V22a4 4 0 0 1 4-4z"/>',
    live: true,
    options: [{ id: "duree", label: "Temps de parole", def: "60", choices: ["30", "60", "90"].map((id) => ({ id, name: TIMES[id], hint: HINTS[id] })) }],
    view(g) {
      const list = topics(g), st = state(g, list.length), x = verdict(g, st.k);
      if (!list.length) return '<p class="g-note" data-screen="vide">Les sujets de débat ne sont pas arrivés jusqu\'ici. Recharge la page pour réessayer.</p>';
      return st.ph === "sujet" ? vTopic(g, list, st.k) : st.ph === "fin" ? vEnd(g, list, st.k)
        : st.ph !== "vote" ? vSpeak(g, list, st) : x ? vVerdict(g, list, st.k, x) : vVote(g, list, st.k);
    },
    act(g, name, el) {
      const n = TOPICS.length, o = order(g), st = state(g, n), k = st.k, last = k >= n - 1, v = el.getAttribute("data-v");
      if (!n) return;
      /* Le bip du départ sert aussi à obtenir le droit de sonner à la fin du temps : le navigateur ne
         l'accorde que pendant un geste. */
      if (name === "go" && st.ph === "sujet") { g.kit.beep(); move(g, k, "pour"); }
      else if (name === "skip" && st.ph === "sujet" && !last) move(g, k + 1, "sujet");
      else if (name === "done" && (st.ph === "pour" || st.ph === "contre")) { g.kit.beep(); move(g, k, after(st.ph)); }
      else if (name === "vote" && st.ph === "vote" && okVote(v) && !verdict(g, k)) {
        if (!g.duo) g.share({ v: Object.assign(votes(g.sh.v, k), { [k]: v }) });
        else if (!pick(g.S[g.me].v, k)) g.set(g.me, { v: Object.assign(votes(g.S[g.me].v, k), { [k]: v }) });
      } else if (name === "next" && st.ph === "vote" && verdict(g, k) && !last) move(g, k + 1, "sujet");
      else if (name === "end" && st.ph === "vote" && verdict(g, k)) move(g, k, "fin");
      /* Les sujets passés à l'écran pendant cette manche vont au bout de la liste des déjà vus : ils reviendront les derniers. */
      else if (name === "again" && st.ph === "fin") g.newGame({ vus: o.ids.slice(Math.max(k + 1, o.fresh)).concat(o.ids.slice(0, k + 1)) });
    },
    over(g) { return state(g, TOPICS.length).ph === "fin"; },
    mount(g, root) {
      const scr = root.querySelector(".debat"), num = root.querySelector(".debat-num"), ring = root.querySelector(".debat-ring"), born = Date.now();
      if (!scr) return;
      const st = state(g, TOPICS.length), w = st.ph === "pour" ? pour(g, st.k) : g.other(pour(g, st.k)), name = scr.getAttribute("data-screen");
      const key = name + "/" + Array.from(scr.querySelectorAll("[data-act]"), (b) => b.getAttribute("data-act")).join();
      /* Ce que l'écran affiche : le chrono qui tourne (0), le temps écoulé (1), ou la proposition de passer à la suite (2). */
      const drawn = ring ? 0 : root.querySelector('[data-act="done"]') ? 2 : 1;
      let t = g.local.t, e = g.local.e, lock = null, asked = false, off = false, timer = 0, seen = born;
      /* Première fois que cet appareil voit cette phase : son chrono part de maintenant. */
      if (!t || t.k !== st.k || t.ph !== st.ph) t = { k: st.k, ph: st.ph, at: born };
      /* Première fois qu'il affiche cet écran, avec ces boutons. */
      if (!e || e.n !== key) e = { n: key, at: born };
      if (t !== g.local.t || e !== g.local.e) { g.local.t = t; g.local.e = e; g.save(); }
      /* Les touchers qui suivent de trop près l'apparition de ces boutons sont arrêtés avant d'en atteindre un,
         y compris « Arrêter la partie », que le socle place là où se trouvait la rangée du bas. Au clavier
         (detail à 0), l'appui ne peut pas viser l'écran d'avant : le focus n'est plus sur un bouton. */
      root.addEventListener("click", (ev) => {
        const age = Date.now() - e.at;
        if (ev.detail && age >= 0 && age < SETTLE) { ev.preventDefault(); ev.stopPropagation(); }
      }, true);
      /* L'autre téléphone a écrit pendant qu'on choisissait au clavier : le focus revient sur le même bouton. */
      const same = kept && kept.n === name && Array.from(scr.querySelectorAll("[data-act]")).find((b) => b.getAttribute("data-act") === kept.act && b.getAttribute("data-v") === kept.v);
      if (same) same.focus({ preventScroll: true });
      /* Cet écran a vu le chrono tourner jusqu'à maintenant. Rouvert ou réveillé après coup (retour de l'accueil,
         autre application), il ne sait pas encore si l'autre téléphone a déjà enchaîné : il ne signale rien
         et n'envoie rien. */
      const live = () => !drawn && Date.now() - seen < 1500;
      /* Une minute sans toucher l'écran : il ne doit pas se mettre en veille au milieu d'une plaidoirie. */
      const awake = () => {
        if (lock || asked || document.hidden || !navigator.wakeLock) return;
        asked = true;
        navigator.wakeLock.request("screen").then((l) => {
          asked = false;
          lock = l;
          l.addEventListener("release", () => { lock = null; });
          if (off) l.release();
        }, () => { /* refusé (page intégrée, batterie faible) : tant pis */ });
      };
      if (num && drawn < 2) {
        timer = setInterval(() => {
          const s = left(g, st), now = stage(s), n = String(Math.ceil(s)), ok = live();
          seen = Date.now();
          if (now === 1 && !t.z) {
            t.z = 1;
            if (ok) {
              signal(g, w);
              /* Seul l'appareil où la phase a été lancée enchaîne tout seul : ce minuteur est né d'un geste fait ici. */
              if (t.mine && (!g.duo || g.sh.by === g.me)) { move(g, st.k, after(st.ph)); return; }
            }
            g.save();
          }
          if (now !== drawn) { g.render(); return; }
          if (now) return;
          if (num.textContent !== n) num.textContent = n;
          ring.style.strokeDashoffset = (RING * (1 - s / dur(g))).toFixed(1);
          awake();
        }, 200);
      }
      return () => {
        const to = state(g, TOPICS.length), el = document.activeElement;
        clearInterval(timer);
        off = true;
        if (lock) lock.release();
        kept = scr.contains(el) && el.hasAttribute("data-act") ? { n: name, act: el.getAttribute("data-act"), v: el.getAttribute("data-v") } : null;
        /* L'autre téléphone, parti un instant plus tôt, a enchaîné à la fin de son chrono : celui d'ici
           n'arrivera jamais à zéro, c'est donc maintenant qu'il signale la fin du temps. */
        if (live() && !t.z && g.local.t === t && to.k === st.k && to.ph === after(st.ph) && left(g, st) < NEAR) signal(g, w);
      };
    }
  });
})();
</script>

<script>
/* Les cartes à piocher : une pile de questions, de défis et de cartes à deux, que le couple
   fait défiler ensemble. La pile se déduit des réglages (paquet, lieu, seed) : elle est donc
   la même sur les deux téléphones et seule la position voyage.
   État commun : { i }, le rang de la carte affichée ; i = taille de la pile quand le paquet
   est fini. Rien dans les tranches : aucune carte n'appartient à un joueur et il n'y a rien
   à cacher. Sur l'appareil : g.local.pick, quand on a ouvert le choix d'un autre paquet.
   Un message par carte piochée, pas plus. */
(function () {
  "use strict";

  const DATA = (window.GAME_DATA && window.GAME_DATA.cartes) || { decks: [] };
  const KINDS = { q: "Question", d: "Défi", 2: "À deux" };
  const MIX = { id: "melange", name: "Mélange", hint: "Léger et profond, battus ensemble." };
  const deck = (id) => DATA.decks.find((d) => d.id === id);
  /* Les paquets proposés : le mélange se range avant le paquet réservé aux adultes, dont il ne contient rien. */
  const DECKS = DATA.decks.filter((d) => !d.adult).concat(MIX, DATA.decks.filter((d) => d.adult));
  /* Le paquet de la manche. Ce réglage vient parfois de l'autre téléphone : inconnu, il retombe sur le paquet léger. */
  const chosen = (g) => DECKS.find((d) => d.id === g.setup.deck) || deck("leger") || MIX;
  /* Le jeu se déclare avant que le socle sache si l'on peut jouer sur deux téléphones : même test que le moteur
     (un vrai site, hors d'un cadre, avec le chiffrement du navigateur). Sinon, la présentation ne promet pas de jouer à distance. */
  let two = /^https?:$/.test(location.protocol) && !!(window.crypto && window.crypto.subtle);
  try { two = two && window.self === window.top; } catch (e) { two = false; }

  /* La pile de la manche : mêmes cartes, même ordre et même premier joueur sur les deux téléphones.
     Les cartes pour une seule personne alternent de l'un à l'autre, quelles que soient les cartes
     à deux glissées entre elles. Le mélange tire la moitié de chaque paquet pour garder la même longueur. */
  function pile(g) {
    const k = g.kit, seed = Number(g.setup.seed) >>> 0, far = g.duo && g.setup.lieu === "distance";
    const cards = (id) => ((deck(id) || {}).cards || []).filter((c) => c && KINDS.hasOwnProperty(c.t) && typeof c.x === "string" && !(far && c.near));
    const half = (id, s) => { const all = k.shuffle(cards(id), s); return all.slice(0, Math.ceil(all.length / 2)); };
    const id = chosen(g).id;
    let w = seed % 2 ? "b" : "a";
    return k.shuffle(id === "melange" ? half("leger", seed + 1).concat(half("profond", seed + 2)) : cards(id), seed).map((c) => {
      const who = c.t === "2" ? null : w;
      if (who) w = g.other(w);
      return { t: c.t, x: c.x, w: who };
    });
  }
  /* La position vient parfois de l'autre téléphone : tout ce qui n'est pas un rang de la pile ramène à la première carte. */
  const rank = (g, n) => (Number.isInteger(g.sh.i) && g.sh.i >= 0 && g.sh.i <= n ? g.sh.i : 0);
  /* Le jeu n'écrit que ce qui est à lui : ce qu'un autre a glissé dans l'état commun ou dans les réglages ne doit pas
     repartir avec chaque carte (une clé laissée à undefined disparaît à l'enregistrement et à l'envoi). */
  const only = (old, keep) => Object.keys(old).reduce((o, key) => { if (!(key in o)) o[key] = undefined; return o; }, keep);

  /* Ce que cet appareil vient d'afficher, pour faire entrer la carte du bon côté et pour savoir ce qui a
     changé sous le doigt (mine : le changement vient d'un geste fait ici). focus : le bouton du choix
     d'un paquet qui avait le focus au moment où l'écran a été réaffiché. */
  let last = null, mine = false, lock = 0, focus = -1;

  /* L'écran vient de changer sous le doigt (lock, posé dans mount) : pendant une demi-seconde, un toucher vise encore l'ancien. */
  const late = () => Date.now() < lock;

  function move(g, step) {
    const n = pile(g).length, i = rank(g, n) + step;
    if (!n || i < 0 || i > n || late()) return;
    mine = true;
    g.local.pick = false;
    g.share(only(g.sh, { i }));
  }

  function vCard(g, list, i) {
    const k = g.kit, n = list.length, c = list[i], w = c.w, o = w ? k.nm(g.other(w)) : "", oth = g.other(g.me);
    const text = w ? k.fill(c.x, { o, de_o: k.de(o), que_o: k.que(o) }) : c.x;
    const whose = !w ? "Pour vous deux" : !g.duo ? "Pour " + k.nm(w) : (w === g.me ? "À toi" : "À " + k.nm(w)) + (c.t === "d" ? " de jouer" : " de répondre");
    /* L'attente de l'autre se place au-dessus de la carte : le rappel du lien d'invitation s'y déplie sans passer sous les boutons. */
    return '<div class="cartes' + (w ? " as-" + w : "") + '" data-screen="carte-' + i + '">' + (g.duo && !g.here(oth) ? k.wait(g, "En attente " + k.de(k.nm(oth)) + "…") : "") +
      '<p class="cartes-step"><span>' + k.esc(chosen(g).name) + ' · <button class="link" type="button" data-act="pick" aria-label="Changer de paquet">changer</button></span><span class="cartes-count"><span aria-hidden="true">' + (i + 1) + "\u00a0/\u00a0" + n +
      '</span><span class="sr">Carte ' + (i + 1) + " sur " + n + '</span></span></p><div class="cartes-stack" data-left="' + Math.min(n - 1 - i, 2) + '">' +
      '<article class="g-card cartes-card' + (w ? " " + w : "") + (g.duo && w === g.me ? " me" : "") + '" data-t="' + c.t + '" data-i="' + i + '"><p class="cartes-head" id="cartes-head"><span class="cartes-for">' +
      '<span class="cartes-inks">' + (w ? '<i class="sw ' + w + '"></i>' : '<i class="sw a"></i><i class="sw b"></i>') + "</span>" + k.esc(whose) + '</span><span class="g-tag">' + KINDS[c.t] + "</span></p>" +
      '<h1 class="g-card-text cartes-text' + (text.length > 110 ? " long" : "") + '" tabindex="-1" data-focus aria-describedby="cartes-head">' + k.esc(text) + "</h1></article></div>" +
      '<div class="g-actions"><button class="btn alt" type="button" data-act="prev"' + (i ? "" : " disabled") + '>Précédente</button><button class="btn" type="button" data-act="next">' +
      (i === n - 1 ? "Finir le paquet" : "Carte suivante") + "</button></div></div>";
  }

  /* Le choix d'un paquet, en trois occasions : le paquet est vide, il est fini, ou on veut en changer en route.
     Le retour à la carte tient la rangée du bas, à la place de « Précédente » et « Carte suivante » : aucun paquet
     ne s'affiche jamais là où le pouce vient de toucher, et un toucher de trop n'en ouvre pas un autre. */
  function vDecks(g, n, i) {
    const k = g.kit, d = chosen(g), cur = n ? d.id : "";
    const back = (act, text) => '<div class="g-actions"><button class="btn alt" type="button" data-act="' + act + '">' + text + "</button></div>";
    const [screen, where, title, lead, label, foot] = !n
      ? ["vide", "", "Ce paquet est vide.", "Il n'y a aucune carte à piocher ici pour le moment.", "Piocher plutôt dans", ""]
      : i === n
        ? ["fin", " · fin du paquet", "Vous avez vidé le paquet.", k.pl(n, "carte", "cartes") + ", et sûrement une ou deux découvertes. On continue\u00a0?" + (g.duo ? " Le paquet choisi s'ouvre sur vos deux téléphones." : ""),
          "Continuer avec", back("prev", "Revenir à la dernière carte")]
        : ["paquets", " · carte " + (i + 1) + " sur " + n, "On change de paquet\u00a0?", "La pioche repart à la première carte du paquet choisi" + (g.duo ? ", sur vos deux téléphones." : "."),
          "Piocher dans", back("pick", "Revenir à la carte")];
    return '<div class="cartes cartes-end" data-screen="' + screen + '"><div class="glyph big"><svg class="inks" viewBox="0 0 48 48" aria-hidden="true">' + g.def.glyph + '</svg></div><p class="eyebrow">' + k.esc(d.name) + where +
      '</p><h1 class="g-title" tabindex="-1" data-focus>' + title + '</h1><p class="g-lead">' + lead + "</p>" +
      (DATA.decks.length ? '<div class="g-opts"><p class="g-opts-label">' + label + '</p><div class="g-choices">' + DECKS.map((x) =>
        '<button class="g-choice" type="button" data-act="deck" data-deck="' + k.esc(x.id) + '" aria-pressed="' + (x.id === cur) + '"><b>' + k.esc(x.name) + (x.adult ? ' <span class="g-tag">Adultes</span>' : "") +
        "</b><span>" + k.esc(x.id === cur ? "Le même paquet, rebattu." : x.hint) + "</span></button>").join("") + "</div></div>" : "") + foot + "</div>";
  }

  (window.GAMES = window.GAMES || []).push({
    id: "cartes",
    v: 1,
    title: "Les cartes à piocher",
    hook: "Qu'est-ce qu'on ne s'est jamais demandé ?",
    blurb: "Chacun son tour, une carte : une question à laquelle répondre, un défi à relever, un moment à partager. Trois paquets : du léger, du profond et du coquin.",
    meta: "180 cartes · ni score ni chrono",
    intro: [
      "Une carte s'affiche : une question à laquelle répondre à voix haute, un petit défi à relever, ou une carte à jouer à deux. Les questions et les défis s'adressent à l'un de vous, chacun son tour : la carte dit pour qui elle est. Ensuite, on pioche la suivante.",
      (two ? "Posez un téléphone entre vous, ou prenez chacun le vôtre, même à distance pendant un appel : la même carte s'affiche des deux côtés." : "Posez le téléphone entre vous et lisez la carte à voix haute.") +
        " Pas de score, pas de chrono, et on a le droit de passer une carte."
    ],
    glyph: '<rect class="ink-a" x="15" y="8" width="18" height="28" rx="4" transform="rotate(-14 24 40)"/><rect class="ink-b" x="15" y="8" width="18" height="28" rx="4" transform="rotate(14 24 40)"/>',
    live: true,
    options: [{ id: "deck", label: "Paquet", def: "leger", choices: DECKS }].concat(two ? {
      id: "lieu", label: "Vous êtes", def: "ensemble",
      choices: [
        { id: "ensemble", name: "Côte à côte", hint: "Dans la même pièce : toutes les cartes du paquet." },
        { id: "distance", name: "À distance", hint: "En appel : sans les cartes qui demandent d'être ensemble." }
      ]
    } : []),
    view(g) {
      const list = pile(g), n = list.length, i = rank(g, n);
      return !n || i === n || g.local.pick ? vDecks(g, n, i) : vCard(g, list, i);
    },
    act(g, name, el) {
      if (name === "next") move(g, 1);
      else if (name === "prev") move(g, -1);
      else if (late()) return;
      else if (name === "pick") { g.local.pick = !g.local.pick; g.save(); g.render(); }
      else if (name === "deck") { mine = true; g.newGame(only(g.setup, { deck: el.getAttribute("data-deck"), lieu: g.setup.lieu === "distance" ? "distance" : "ensemble" })); }
    },

    key(g, ev) {
      if (g.local.pick || ev.repeat || ev.metaKey || ev.ctrlKey || ev.altKey || /^(INPUT|TEXTAREA)$/.test(ev.target.tagName)) return;
      if (ev.key === "ArrowRight") move(g, 1);
      else if (ev.key === "ArrowLeft") move(g, -1);

    mount(g, root) {

      /* Le chrono court depuis l'heure de départ enregistrée : recharger la page ne le remet pas à zéro. À zéro,
         la feuille part telle quelle (c'est le minuteur que le joueur a lancé, pas une réaction à l'autre téléphone). */
      const timer = secs && setInterval(() => {
        const left = remain(cur);
        if (left) {
          time.textContent = clock(left);
          time.classList.toggle("is-late", left <= 10);
          bar.style.width = (100 * left) / secs + "%";
          return;
        }
        /* Le minuteur s'arrête là et rend la main à l'affichage. Si cette feuille n'est plus celle de la partie
           (une nouvelle pile est arrivée pendant un trait), il ne sonne pas et ne rend rien. */
        clearInterval(timer);
        commit();
        const mine = stage(g).cur === cur;
        g.hold(false);
        if (mine) { k.buzz([120, 60, 120]); k.beep(); submit(g); }
      }, 250);
      redraw();
      pad = { commit, redraw };
      return () => { clearInterval(timer); commit(); pad = null; };
    },
    extra(k) {
      const list = gallery(k);
      return list.length ? '<details class="more dessin-gal"><summary>Vos dessins (' + list.length + ')</summary><p class="hint">Vos dernières paires, gardées sur cet appareil (' + KEEP +
        ' au plus). Touche une paire pour enregistrer son image.</p><div class="dessin-thumbs">' + list.map((p, i) => '<button class="dessin-thumb" type="button" data-act="image" data-v="' + i +
          '" aria-label="Enregistrer l\'image\u00a0: ' + k.esc(p.x.slice(0, 120)) + '">' + art(p.d[0], "", 3) + art(p.d[1], "", 3) + "<span>" + k.esc(p.x.slice(0, 120)) + "</span></button>").reverse().join("") +
        '</div><p><button class="link" type="button" data-act="empty">' + label("empty") + "</button></p></details>" : "";
    },
    extraAct(k, name, el) {
      const p = gallery(k)[int(parseInt(el.getAttribute("data-v"), 10), KEEP)];
      if (name === "image" && p) {
        save(p);
      } else if (name === "empty" && twice(name)) {
        k.store.del("dessin:galerie");
        k.render();
      }
    }
  });
})();
</script>

<script>
/* Qui de nous deux ? (le jeu) : quinze questions express, un prénom à chaque fois, puis on compare.
   Chacun répond de son côté ; le résultat s'ouvre quand les deux ont fini.
   Une réponse tient en un caractère : "a" ou "b" (le prénom touché), "2" (les deux), "0" (personne).
   - Pendant qu'on répond, les réponses restent sur l'appareil (g.local.d[w]) : rien ne part.
   - À la quinzième, la tranche reçoit { r: "ab20…" } en un seul envoi. Celui qui finit en second voit
     aussitôt le résultat : il y ajoute fin: 1. Celui qui avait fini en premier touche « Voir le
     résultat » quand les réponses de l'autre arrivent, ce qui envoie fin: 1. On ne relance une partie
     que lorsque l'autre a vu le résultat de celle-ci.
   Réglages : pack, puis, après un « Rejouer », deck (la seed de la première partie) et at (où en est
   chaque paquet), comme dans « Sur la même longueur d'onde ». */
(function () {
  "use strict";

  const DATA = (window.GAME_DATA && window.GAME_DATA.quiest) || { packs: [] };
  const N = 15;
  /* Le mélange ne pioche jamais dans un paquet pour adultes. */
  const MIX = [["quotidien", 8], ["caractere", 7]];
  const FULL = new RegExp("^[ab20]{" + N + "}$");
  const LEVELS = [
    [15, "Une seule et même version des faits."],
    [12, "Vous vous connaissez par cœur."],
    [9, "D'accord sur l'essentiel."],
    [6, "Deux versions, de quoi animer la soirée."],
    [0, "Chacun sa vérité. Ça promet."]
  ];
  const packs = () => (Array.isArray(DATA.packs) ? DATA.packs : []).filter((p) => p && typeof p.id === "string" && Array.isArray(p.items));
  const pack = (id) => packs().find((p) => p.id === id);
  const items = (p) => (p ? p.items.filter((x) => typeof x === "string" && x) : []);
  const int = (o, key) => { const n = o && typeof o === "object" ? o[key] : 0; return Number.isInteger(n) && n > 0 && n < 1e6 ? n : 0; };
  const seedOf = (g) => Number(g.setup.seed) || 1;
  const plan = (g) => (pack(g.setup.pack) ? [[g.setup.pack, N]] : MIX);

  /* Les quinze questions, tirées de la même façon sur les deux téléphones ; « Rejouer » reprend chaque
     paquet où l'on s'était arrêté : une question ne revient qu'une fois son paquet épuisé. */
  function questions(g) {
    const k = g.kit, deck = Number(g.setup.deck) || seedOf(g);
    let list = [];
    plan(g).forEach(([id, n]) => {
      const p = pack(id), all = k.shuffle(items(p), deck + packs().indexOf(p));
      for (let i = 0; i < Math.min(n, all.length); i++) list.push(all[(int(g.setup.at, id) + i) % all.length]);
    });
    return pack(g.setup.pack) ? list : k.shuffle(list, seedOf(g));
  }

  /* Les réponses publiées d'un joueur : une chaîne de quinze codes, sinon rien (elle peut venir de l'autre téléphone). */
  const answers = (g, w) => { const r = g.S[w].r; return typeof r === "string" && FULL.test(r) ? r : null; };
  const fin = (g, w) => g.S[w].fin === 1;
  /* Le brouillon de qui répond sur cet appareil. */
  function draft(g, w) {
    const d = g.local.d && typeof g.local.d === "object" ? g.local.d[w] : "";
    return typeof d === "string" && /^[ab20]*$/.test(d) ? d.slice(0, N - 1) : "";
  }
  /* Qui répond maintenant : moi sur deux téléphones ; sur un seul, "a" puis "b", avec le passage
     du téléphone entre les deux ("pass"). null quand j'ai fini. */
  function turn(g) {
    if (g.duo) return answers(g, g.me) ? null : g.me;
    if (!answers(g, "a")) return "a";
    if (!answers(g, "b")) return g.local.pass ? "b" : "pass";
    return null;
  }
  const ready = (g) => !g.duo || fin(g, g.other(g.me));
  const both = (g) => !!answers(g, "a") && !!answers(g, "b");

  /* Ce que désigne une réponse, à l'encre de la personne désignée. */
  function label(g, c) {
    const k = g.kit;
    if (c === "a" || c === "b") return '<span class="quiest-chip ' + c + '"><i class="sw ' + c + '"></i>' + k.esc(k.nm(c)) + "</span>";
    return '<span class="quiest-chip">' + (c === "2" ? "Les deux" : "Personne") + "</span>";
  }
  /* L'étiquette d'un désaccord, selon la façon dont les deux versions se contredisent. */
  function tag(x, y) {
    if (x === "a" && y === "b") return "Chacun lève la main";
    if (x === "b" && y === "a") return "Vous vous renvoyez la balle";
    if (x === "0" || y === "0") return x === "2" || y === "2" ? "Tout ou rien" : "Quelqu'un est dans le déni";
    return "À moitié d'accord";
  }

  const top = (g, i) => '<div class="quiest-top"><p class="quiest-step">' + (!i && g.gen > 1 ? "Nouvelle partie · " : "") + "Question " + (i + 1) + " sur " + N + "</p></div>" +
    '<div class="progress" role="progressbar" aria-label="Avancement" aria-valuemin="0" aria-valuemax="' + N + '" aria-valuenow="' + i + '"><span style="width:' + (100 * i) / N + '%"></span></div>';

  function vAsk(g, list, w) {
    const k = g.kit, i = draft(g, w).length;
    const pick = (c, cls, text) => '<button class="' + cls + '" type="button" data-act="pick" data-val="' + c + '" data-i="' + i + '">' + text + "</button>";
    const name = (c) => pick(c, "quiest-pick " + c, '<i class="sw ' + c + '"></i><span>' + k.esc(k.nm(c)) + "</span>");
    return '<div class="quiest as-' + w + '" data-screen="q-' + i + "-" + w + '">' + top(g, i) +
      '<p class="quiest-who">' + k.who(w) + " répond" + (g.duo ? "" : '<span class="quiest-shh">' + k.esc(k.nm(g.other(w))) + " ne regarde pas</span>") + "</p>" +
      '<div class="quiest-card" data-i="' + i + '"><h1 class="g-title" tabindex="-1" data-focus>' + k.esc(list[i]) + "</h1></div>" +
      '<div class="quiest-answers" role="group" aria-label="Ta réponse"><div class="quiest-names">' + name("a") + name("b") + '</div><div class="quiest-alt">' +
      pick("2", "quiest-small", "Les deux") + pick("0", "quiest-small", "Personne") + "</div>" +
      (i ? '<button class="link g-link quiest-back" type="button" data-act="back">Revenir à la question précédente</button>' : "") + "</div></div>";
  }

  function vWait(g) {
    const k = g.kit, O = k.nm(g.other(g.me));
    return '<div class="quiest" data-screen="attente"><div class="quiest-venn">' + k.venn(0) + '</div><h1 class="g-title" tabindex="-1" data-focus>C\'est envoyé.</h1><p class="g-lead">' +
      k.esc("Le résultat s'ouvre dès " + k.que(O) + " aura répondu à son tour. Tes réponses restent cachées jusque-là.") + "</p>" + k.wait(g, "En attente des réponses " + k.de(O) + "…") + "</div>";
  }

  function vReady(g) {
    const k = g.kit;
    return '<div class="quiest" data-screen="pret"><div class="quiest-venn">' + k.venn(50) + '</div><h1 class="g-title" tabindex="-1" data-focus>' + k.esc("Les réponses " + k.de(k.nm(g.other(g.me))) + " sont arrivées.") +
      '</h1><p class="g-lead">Le moment de vérité.</p><div class="g-actions"><button class="btn" type="button" data-act="voir">Voir le résultat</button></div></div>';
  }

  function vEnd(g, list) {
    const k = g.kit, A = answers(g, "a"), B = answers(g, "b"), cur = pack(g.setup.pack) ? g.setup.pack : "melange";
    const rows = list.map((q, i) => ({ q, x: A[i], y: B[i] }));
    const same = rows.filter((r) => r.x === r.y), diff = rows.filter((r) => r.x !== r.y), n = same.length;
    const say = (w, c) => '<span class="quiest-say"><span class="quiest-by"><i class="sw ' + w + '"></i>Selon ' + k.esc(k.nm(w)) + "</span>" + label(g, c) + "</span>";
    const row = (r, ok) => '<li class="quiest-row ' + (ok ? "ok" : "gap") + '"><p class="quiest-q">' + k.esc(r.q) + '</p><div class="quiest-two">' + say("a", r.x) + say("b", r.y) + "</div>" +
      (ok ? "" : '<span class="g-tag quiest-tag">' + k.esc(tag(r.x, r.y)) + "</span>") + "</li>";
    const part = (title, list2, ok) => list2.length ? '<h2 class="quiest-h">' + title + " <span>" + list2.length + '</span></h2><ul class="quiest-list">' + list2.map((r) => row(r, ok)).join("") + "</ul>" : "";
    const choice = (id, name, adult) => '<button class="g-choice" type="button" data-act="again" data-pack="' + id + '"' + (cur === id ? ' aria-current="true"' : "") + "><b>" + k.esc(name) +
      (adult ? ' <span class="g-tag">Adultes</span>' : "") + "</b></button>";
    return '<div class="quiest" data-screen="resultat"><p class="eyebrow">Résultat</p><div class="quiest-venn">' + k.venn(Math.round((100 * n) / N)) + '</div><p class="g-big">' + n + "<span> / " + N +
      '</span></p><h1 class="g-title" tabindex="-1" data-focus>' + LEVELS.find((l) => n >= l[0])[1] + '</h1><p class="g-lead">' +
      (n === N ? "Pas une seule question pour vous départager." : n ? k.pl(n, "réponse", "réponses") + " en commun, et " + k.pl(N - n, "version", "versions") + " à confronter." : "Pas une seule réponse en commun. À vous de raconter.") + "</p>" +
      part("Vous êtes d'accord", same, true) + part("Deux versions des faits", diff, false) + (ready(g)
        ? '<div class="g-opts"><p class="g-opts-label">Rejouer avec</p><div class="g-choices">' + choice("melange", "Mélange") + packs().map((p) => choice(p.id, p.name, p.adult)).join("") + "</div></div>"
        : k.wait(g, "Vous pourrez rejouer dès " + k.que(k.nm(g.other(g.me))) + " aura vu le résultat.")) + "</div>";
  }

  /* Le dernier toucher pris en compte : un double toucher ne répond pas à deux questions d'un coup. */
  let lastTap = 0, shownQ = "";

  (window.GAMES = window.GAMES || []).push({
    id: "quiest",
    v: 1,
    title: "Qui de nous deux\u00a0?",
    hook: "Qui ronfle\u00a0? Qui vole la couette\u00a0?",
    blurb: "Quinze questions express, un prénom à chaque fois. Puis on compare\u00a0: qui est d'accord, et qui se renvoie la balle.",
    meta: "15 questions · 3 min",
    intro: [
      "«\u00a0Qui parle à ses plantes\u00a0?\u00a0», «\u00a0Qui finit les restes en cachette\u00a0?\u00a0»\u00a0: à chaque question, touche le prénom qui s'impose. «\u00a0Les deux\u00a0» et «\u00a0Personne\u00a0» sont permis, l'hésitation beaucoup moins.",
      "Chacun répond de son côté, sans regarder l'autre. À la fin, vous découvrez où vos versions concordent, et où elles se contredisent."
    ],
    glyph: '<circle class="ink-a" cx="15" cy="30" r="11"/><rect class="ink-b" x="22" y="19" width="22" height="22" rx="5"/><path class="ring-a" d="M19 9.5a5 5 0 1 1 7 4.6c-1.5.7-2 1.7-2 3.4"/>',
    live: false,
    options: [{
      id: "pack", label: "Questions", def: "melange",
      choices: [{ id: "melange", name: "Mélange", hint: "Le quotidien et nos caractères." }].concat(packs().map((p) => ({ id: p.id, name: p.name, hint: p.hint, adult: !!p.adult })))
    }],
    view(g) {
      const k = g.kit, list = questions(g);
      if (list.length < N) return '<div class="quiest" data-screen="vide"><h1 class="g-title" tabindex="-1" data-focus>Les questions ne sont pas arrivées.</h1><p class="g-lead">Recharge la page\u00a0: la partie reprendra où elle en était.</p></div>';
      const w = turn(g);
      if (w === "pass") return '<div class="quiest" data-screen="passe">' + k.pass("b", "moi") + '<p class="hint">' + k.esc(k.nm("a") + " a répondu. Les mêmes questions t'attendent, dans le même ordre.") + "</p></div>";
      if (w) return vAsk(g, list, w);
      if (!both(g)) return vWait(g);
      if (g.duo && !fin(g, g.me)) return vReady(g);
      return vEnd(g, list);
    },
    act(g, name, el) {
      const w = turn(g);
      if (name === "pick" && w && w !== "pass") {
        const c = el.getAttribute("data-val"), d = draft(g, w), now = Date.now();
        /* Le bouton touché doit appartenir à la question affichée, et pas au second toucher d'un double toucher. */
        if (!/^[ab20]$/.test(c) || el.getAttribute("data-i") !== String(d.length) || now - lastTap < 250) return;
        lastTap = now;
        const next = d + c;
        g.local.d = Object.assign({}, g.local.d, { [w]: next.length < N ? next : "" });
        if (next.length < N) { g.save(); g.render(); return; }
        const patch = { r: next };
        if (g.duo && answers(g, g.other(w))) patch.fin = 1;
        g.set(w, patch);
      } else if (name === "back" && w && w !== "pass") {
        g.local.d = Object.assign({}, g.local.d, { [w]: draft(g, w).slice(0, -1) });
        g.save();
        g.render();
      } else if (name === "moi" && w === "pass") {
        g.local.pass = 1;
        g.save();
        g.render();
      } else if (name === "voir" && g.duo && both(g) && !fin(g, g.me)) {
        g.set(g.me, { fin: 1 });
      } else if (name === "again" && both(g) && ready(g) && questions(g).length === N) {
        const id = el.getAttribute("data-pack"), at = {};
        packs().forEach((p) => { at[p.id] = int(g.setup.at, p.id); });
        plan(g).forEach(([p, n]) => { const all = items(pack(p)).length; if (all) at[p] = (at[p] + n) % all; });
        g.newGame({ pack: pack(id) ? id : "melange", deck: Number(g.setup.deck) || seedOf(g), at });
      }
    },
    over(g) { return both(g) && (!g.duo || fin(g, g.me)); },
    mount(g, root) {
      const card = root.querySelector(".quiest-card");
      if (!card) { shownQ = ""; return; }
      /* La question n'entre en glissant qu'à sa première apparition, pas quand l'autre téléphone écrit. */
      const key = g.gen + ":" + g.setup.seed + ":" + card.closest("[data-screen]").getAttribute("data-screen");
      if (key !== shownQ) { shownQ = key; card.classList.add("is-new"); }
    }
  });
})();
</script>

<script>
/* L'histoire à quatre mains : une première phrase tirée au sort, puis une phrase chacun, à tour de rôle.
   Chacun ne voit que la dernière phrase de l'autre (et la première de l'histoire), jamais le reste.
   Tranche d'un joueur : { s: [ses phrases, dans l'ordre], fin: 1 }. Chaque phrase part une seule fois, au
   moment où elle est écrite. L'ordre de passage se déduit des deux comptes : qui commence dépend de la seed,
   puis on alterne ; c'est à celui qui a le moins de phrases (à égalité, à celui qui a commencé).
   fin : ce joueur a lu toute l'histoire. Sur deux téléphones, on ne relance que lorsque les deux l'ont lue.
   Réglages : longueur (8, 12 ou 16 phrases), puis, après un « Rejouer », deck (la seed de la première partie)
   et at (combien d'histoires déjà commencées), pour ne resservir une première phrase qu'une fois toutes passées.
   Sur l'appareil : g.local.ok, le nombre de phrases au moment où le joueur suivant a pris le téléphone (un seul
   téléphone) ; g.local.r, où en est la lecture. Les histoires finies sont gardées ici (« Nos histoires »). */
(function () {
  "use strict";

  const DATA = (window.GAME_DATA && window.GAME_DATA.histoire) || {};
  const STARTS = (Array.isArray(DATA.starts) ? DATA.starts : []).filter((s) => typeof s === "string" && s.trim());
  const LENGTHS = ["8", "12", "16"], MAX = 200, KEEP = 10, LIST = "histoire:liste";
  const int = (x, max) => (Number.isInteger(x) && x >= 0 && x <= max ? x : 0);
  const seedOf = (g) => Number(g.setup.seed) >>> 0 || 1;
  const token = (g) => g.gen + ":" + g.setup.seed;
  const size = (g) => (LENGTHS.indexOf(String(g.setup.longueur)) >= 0 && typeof g.setup.longueur !== "object" ? Number(g.setup.longueur) : 12);
  const first = (g) => (seedOf(g) % 2 ? "b" : "a");
  const clean = (s) => s.replace(/\s+/g, " ").trim().slice(0, MAX);
  /* Typographie française pour le texte brut (le partage) : esc() s'en charge pour l'écran. */
  const typo = (s) => s.replace(/ ([?!:;»])/g, " $1").replace(/« /g, "« ");

  /* La première phrase : chaque paquet garde le même ordre d'une partie à la suivante (deck), et « Rejouer »
     passe à la suivante (at). */
  function opening(g) {
    if (!STARTS.length) return null;
    const deck = Number(g.setup.deck) || seedOf(g);
    return g.kit.shuffle(STARTS, deck)[int(g.setup.at, 1e6) % STARTS.length];
  }
  /* Les phrases d'un joueur, telles qu'elles sont arrivées (peut-être de l'autre téléphone) : bornées et en texte. */
  const lines = (g, w) => (Array.isArray(g.S[w].s) ? g.S[w].s.slice(0, 16) : []).map((x) => (typeof x === "string" ? clean(x) : ""));

  /* L'histoire telle qu'elle est : les phrases dans l'ordre, alternées, sans trou. Des comptes incohérents
     (valeurs trafiquées) sont ramenés à ce qui peut s'enchaîner. */
  function stage(g) {
    const N = size(g), f = first(g), o = g.other(f), A = lines(g, f), B = lines(g, o);
    const n = { [f]: Math.min(A.length, B.length + 1) };
    n[o] = Math.min(B.length, n[f]);
    const list = [];
    for (let i = 0; i < N; i++) {
      const w = i % 2 ? o : f;
      if (i >> 1 >= n[w]) break;
      list.push({ w, t: (w === f ? A : B)[i >> 1] });
    }
    const i = list.length, w = i < N ? (i % 2 ? o : f) : null;
    return { N, list, i, w, n, start: opening(g) };
  }
  /* Ce joueur a lu toute l'histoire. */
  const read = (g, st) => st.i >= st.N && int(g.local.r, 1e6) > st.N;
  const ready = (g) => !g.duo || !!g.S[g.other(g.me)].fin;
  /* La dernière phrase de l'autre, que le joueur w doit continuer : sinon, la première de l'histoire. */
  const last = (st, w) => { for (let i = st.i - 1; i >= 0; i--) if (st.list[i].w !== w) return st.list[i]; return null; };

  /* ---------- Histoires gardées sur l'appareil (et ce que l'autre y a écrit : même méfiance à la relecture) ---------- */
  const two = (x) => Array.isArray(x) && typeof x[0] === "string" && typeof x[1] === "string";
  function kept(k) {
    const list = k.store.get(LIST, null);
    return (Array.isArray(list) ? list : []).filter((h) => h && typeof h.k === "string" && typeof h.t === "string" && two(h.n) && Array.isArray(h.s) &&
      h.s.every((x) => Array.isArray(x) && (x[0] === "a" || x[0] === "b") && typeof x[1] === "string")).slice(-KEEP);
  }
  function remember(g, st) {
    const k = g.kit, list = kept(k), key = token(g);
    if (list.some((h) => h.k === key)) return;
    k.store.set(LIST, list.concat({ k: key, t: st.start, n: [k.nm("a").slice(0, 20), k.nm("b").slice(0, 20)], s: st.list.map((x) => [x.w, x.t]) }).slice(-KEEP));
  }
  const entry = (g, st) => ({ t: st.start, n: [g.kit.nm("a"), g.kit.nm("b")], s: st.list.map((x) => [x.w, x.t]) });

  /* Le texte de l'histoire, chaque phrase dans l'encre de qui l'a écrite. */
  function prose(k, h) {
    const who = (w) => '<span class="g-who ' + w + '"><i class="sw ' + w + '"></i>' + k.esc(h.n[w === "b" ? 1 : 0].slice(0, 20)) + "</span>";
    return '<p class="histoire-legend">' + who("a") + who("b") + '</p><p class="histoire-text"><span class="histoire-s">' + k.esc(h.t.slice(0, MAX)) + "</span> " +
      h.s.slice(0, 16).map((x) => '<span class="histoire-s as-' + x[0] + '"><span class="sr">' + k.esc(h.n[x[0] === "b" ? 1 : 0].slice(0, 20) + " : ") + "</span>" + k.esc(x[1].slice(0, MAX) || "…") + "</span>").join(" ") + "</p>";
  }
  const plain = (h) => typo(h.t + " " + h.s.map((x) => x[1]).filter(Boolean).join(" ") + "\n\n— " + h.n[0] + " et " + h.n[1] + ", « L'histoire à quatre mains »");
  const keepBtn = (i) => '<p class="histoire-keep"><button class="btn alt small" type="button" data-act="partager"' + (i != null ? ' data-i="' + i + '"' : "") +
    ">Enregistrer le texte</button><span class=\"histoire-msg\" role=\"status\"></span></p>";

  /* Feuille de partage du téléphone pour du texte ; sinon presse-papiers ; sinon le texte, sélectionné, à copier à la main.
     Tout part dans le geste du joueur, sans attente : sinon le navigateur refuse le partage. */
  function send(text, el) {
    const box = el.parentNode, msg = box.querySelector(".histoire-msg"), say = (t) => { if (msg) msg.textContent = t; };
    const manual = () => {
      let ta = box.querySelector("textarea");
      if (!ta) { ta = document.createElement("textarea"); ta.className = "g-field histoire-raw"; ta.readOnly = true; ta.rows = 6; ta.setAttribute("aria-label", "Le texte de l'histoire"); box.appendChild(ta); }
      ta.value = text;
      ta.focus();
      try { ta.setSelectionRange(0, text.length); } catch (e) { ta.select(); }
      say("Le texte est juste en dessous : copie-le pour le garder.");
    };
    const copy = () => {
      try { navigator.clipboard.writeText(text).then(() => say("Texte copié : colle-le où tu veux."), manual); } catch (e) { manual(); }
    };
    if (typeof navigator.share === "function") {
      try { navigator.share({ title: "L'histoire à quatre mains", text }).catch((e) => { if (!e || e.name !== "AbortError") copy(); }); } catch (e) { copy(); }
    } else copy();
  }

  /* Deux touchers pour tout effacer, entre 0,45 et 4 secondes d'écart. */
  let armed = 0;
  const EMPTY = ["Tout effacer", "Toucher encore pour effacer"];

  /* L'écran affiché et depuis quand : un bouton qui apparaît sous le doigt reste inerte une demi-seconde. */
  let seen = { k: "", at: 0 };
  const HOLD = '[data-act="moi"], [data-act="lire"], [data-act="suite"]';

  /* ---------- Écrans ---------- */
  const top = (g, label, n, of) => '<p class="histoire-step">' + (g.gen > 1 && !n && label.indexOf("Phrase") === 0 ? "Nouvelle histoire · " : "") + label +
    '</p><div class="progress" role="progressbar" aria-label="Avancement" aria-valuemin="0" aria-valuemax="' + of + '" aria-valuenow="' + n + '"><span style="width:' + (100 * n) / of + '%"></span></div>';
  const card = (k, x, label) => '<div class="g-card histoire-card' + (x.w ? " " + x.w : "") + '">' + (x.w ? '<p class="histoire-by">' + label + "</p>" : '<p class="g-tag">' + label + "</p>") +
    '<p class="g-card-text">' + k.esc(x.t || "…") + "</p></div>";

  function vWrite(g, st) {
    const k = g.kit, w = st.w, o = g.other(w), O = k.nm(o), prev = last(st, w), end = st.i === st.N - 1;
    return '<div class="histoire as-' + w + '" data-screen="ecrire-' + st.i + "-" + w + '">' + top(g, "Phrase " + (st.i + 1) + " sur " + st.N, st.i, st.N) +
      '<p class="histoire-who">' + k.who(w) + ' écrit</p><h1 class="g-title" tabindex="-1" data-focus>' + (end ? "À toi de la finir." : !st.i ? "À toi de lancer l'histoire." : "À toi d'écrire la suite.") + "</h1>" +
      (prev ? '<p class="histoire-start"><span class="eyebrow">La première phrase</span> ' + k.esc(st.start) + "</p>" + card(k, prev, "La dernière phrase " + k.esc(k.de(O)))
        : card(k, { t: st.start }, "La première phrase")) +
      '<form class="histoire-form"><textarea class="g-field histoire-field" name="phrase" rows="4" maxlength="' + MAX + '" data-keep="phrase-' + g.gen + "-" + seedOf(g) + "-" + st.i + "-" + w +
      '" enterkeyhint="done" placeholder="Ta phrase" aria-label="' + k.esc(k.nm(w) + ", ta phrase " + (st.i + 1) + " sur " + st.N) + '" aria-describedby="histoire-aide"></textarea>' +
      '<p class="hint" id="histoire-aide"><span class="histoire-count">' + MAX + " signes au plus.</span> " +
      k.esc(end ? "C'est la dernière phrase : à toi de trouver la chute." : O + " ne verra que celle-ci, pas le reste de l'histoire.") + "</p>" +
      '<div class="g-actions"><button class="btn" type="submit">' + (end ? "Finir l'histoire" : "Ajouter ma phrase") + "</button></div></form></div>";
  }

  function vWait(g, st) {
    const k = g.kit, O = k.nm(st.w), mine = last(st, st.w);
    return '<div class="histoire as-' + g.me + '" data-screen="attente-' + st.i + '">' + top(g, "Phrase " + (st.i + 1) + " sur " + st.N, st.i, st.N) +
      '<h1 class="g-title" tabindex="-1" data-focus>Au tour ' + k.esc(k.de(O)) + ".</h1>" +
      (mine ? '<p class="g-lead">Ta phrase est partie. ' + k.esc(O) + " ne verra qu'elle.</p>" + card(k, mine, "Ta dernière phrase")
        : '<p class="g-lead">' + k.esc(O) + " lance l'histoire. Tu ne verras que sa phrase, pour écrire la suite.</p>") +
      k.wait(g, O + " écrit la phrase " + (st.i + 1) + "…") + "</div>";
  }

  function vPass(g, st) {
    const k = g.kit;
    return '<div class="histoire" data-screen="passe-' + st.i + "-" + st.w + '">' + g.kit.pass(st.w, "moi") + '<p class="hint">' +
      k.esc("Phrase " + (st.i + 1) + " sur " + st.N + ". " + (st.i ? "Tu ne verras que la dernière phrase " + k.de(k.nm(g.other(st.w))) + "." : "C'est toi qui lances l'histoire.")) + "</p></div>";
  }

  function vDone(g) {
    return '<div class="histoire" data-screen="fin"><p class="eyebrow">Dernière phrase écrite</p><h1 class="g-title" tabindex="-1" data-focus>L\'histoire est complète.</h1><p class="g-lead">' +
      (g.duo ? "Vous allez la découvrir phrase par phrase, chacun sur son téléphone." : "Posez le téléphone entre vous deux : vous allez la découvrir phrase par phrase.") +
      '</p><div class="g-actions"><button class="btn" type="button" data-act="lire">Lire l\'histoire</button></div></div>';
  }

  function vRead(g, st, r) {
    const k = g.kit, x = r ? st.list[r - 1] : { t: st.start }, prev = r > 1 ? st.list[r - 2].t : r === 1 ? st.start : "";
    return '<div class="histoire" data-screen="lire-' + r + '">' + top(g, r ? "Phrase " + r + " sur " + st.N : "Lecture", r, st.N) +
      (prev ? '<p class="histoire-prev">' + k.esc(prev || "…") + "</p>" : "") +
      '<div class="histoire-now" tabindex="-1" data-focus>' + card(k, x, x.w ? k.who(x.w) : "La première phrase") + "</div>" +
      '<div class="g-actions"><button class="btn" type="button" data-act="suite">' + (r < st.N ? "Suivante" : "Toute l'histoire") + "</button></div></div>";
  }

  function vAll(g, st) {
    const k = g.kit, cur = String(size(g));
    const choice = (n) => '<button class="g-choice" type="button" data-act="again" data-val="' + n + '"' + (cur === n ? ' aria-current="true"' : "") + "><b>" + n + " phrases</b></button>";
    return '<div class="histoire" data-screen="histoire"><p class="eyebrow">Votre histoire</p><h1 class="g-title" tabindex="-1" data-focus>Voilà ce que vous avez écrit.</h1>' +
      prose(k, entry(g, st)) + keepBtn(null) + '<p class="hint">Elle est aussi gardée sur cet appareil, dans « Nos histoires », sur la présentation du jeu.</p>' +
      (ready(g) ? '<div class="g-opts"><p class="g-opts-label">Une autre histoire</p><div class="g-choices">' + LENGTHS.map(choice).join("") + "</div></div>"
        : k.wait(g, "Vous pourrez recommencer dès " + k.que(k.nm(g.other(g.me))) + " aura lu l'histoire.")) + "</div>";
  }

  (window.GAMES = window.GAMES || []).push({
    id: "histoire",
    v: 1,
    title: "L'histoire à quatre mains",
    hook: "Et si on écrivait une histoire sans savoir où elle va ?",
    blurb: "Une première phrase, puis une phrase chacun, en ne voyant que la dernière de l'autre. À la fin, vous lisez tout.",
    meta: (STARTS.length ? STARTS.length + " débuts · " : "") + "10 min",
    intro: [
      "Une première phrase tombe : « Le pigeon qui entra dans la banque demanda à parler au directeur. » Chacun à son tour écrit la suivante, en ne voyant que la dernière phrase de l'autre, jamais le reste.",
      "Quand toutes les phrases sont écrites, vous découvrez l'histoire entière, phrase par phrase. Elle a rarement le sens prévu, et c'est tout l'intérêt."
    ],
    glyph: '<rect class="ink-a" x="7" y="9" width="22" height="7" rx="3.5"/><rect class="ink-b" x="19" y="21" width="22" height="7" rx="3.5"/><rect class="ink-a" x="7" y="33" width="16" height="7" rx="3.5"/>',
    live: true,
    options: [{
      id: "longueur", label: "Longueur", def: "12",
      choices: [{ id: "8", name: "8 phrases", hint: "Une histoire courte." }, { id: "12", name: "12 phrases", hint: "Le bon compromis." }, { id: "16", name: "16 phrases", hint: "Pour s'égarer." }]
    }],
    view(g) {
      const st = stage(g);
      /* Le fichier des débuts n'est pas arrivé sur cet appareil : surtout pas d'histoire sans début. */
      if (!st.start) return '<div class="histoire" data-screen="vide"><h1 class="g-title" tabindex="-1" data-focus>Les débuts d\'histoire ne sont pas arrivés.</h1><p class="g-lead">Recharge la page : la partie reprendra où elle en était.</p></div>';
      if (st.w) {
        if (g.duo) return st.w === g.me ? vWrite(g, st) : vWait(g, st);
        return g.local.ok === st.i ? vWrite(g, st) : vPass(g, st);
      }
      const r = g.local.r;
      if (!Number.isInteger(r) || r < 0) return vDone(g);
      return r > st.N ? vAll(g, st) : vRead(g, st, r);
    },
    submit(g, form) {
      const st = stage(g), w = st.w, field = form.querySelector("[name=phrase]");
      if (!w || !field || !st.start || (g.duo ? w !== g.me : g.local.ok !== st.i)) return;
      const text = clean(field.value);
      if (!text) { field.focus(); return; }
      g.set(w, { s: lines(g, w).slice(0, st.n[w]).concat(text) });
    },
    input(g, el) {
      if (el.name !== "phrase") return;
      const c = el.form && el.form.querySelector(".histoire-count");
      if (c) c.textContent = (MAX - el.value.length) + " signes restants.";
    },
    act(g, name, el) {
      const st = stage(g), r = g.local.r, calm = Date.now() - seen.at >= 450;
      if (name === "moi" && st.w && !g.duo && g.local.ok !== st.i && calm) {
        g.local.ok = st.i;
        g.save();
        g.render();
      } else if (name === "lire" && !st.w && st.start && !Number.isInteger(r) && calm) {
        g.local.r = 0;
        g.save();
        g.render();
      } else if (name === "suite" && !st.w && Number.isInteger(r) && r >= 0 && r <= st.N && calm) {
        g.local.r = r + 1;
        g.save();
        /* Dernière phrase lue sur deux téléphones : l'autre apprend que j'ai fini (un message, sur mon toucher). */
        if (g.duo && r === st.N && !g.S[g.me].fin) g.set(g.me, { fin: 1 }); else g.render();
      } else if (name === "partager" && read(g, st)) {
        send(plain(entry(g, st)), el);
      } else if (name === "again" && read(g, st) && ready(g)) {
        const v = el.getAttribute("data-val");
        g.newGame({ longueur: LENGTHS.indexOf(v) >= 0 ? v : "12", deck: Number(g.setup.deck) || seedOf(g), at: (int(g.setup.at, 1e6) + 1) % 1e6 });
      }
    },
    over(g) { return read(g, stage(g)); },
    mount(g, root) {
      const st = stage(g), scr = root.querySelector("[data-screen]"), name = token(g) + ":" + (scr ? scr.getAttribute("data-screen") : ""), now = Date.now();
      if (name !== seen.k) seen = { k: name, at: now };
      /* Le bouton qui prend la place de celui qu'on vient de toucher ne répond pas tout de suite : un double
         toucher sur « Ajouter ma phrase » ne doit pas faire passer le téléphone sans que personne l'ait pris. */
      const wait = seen.at + 450 - now, held = wait > 0 ? root.querySelectorAll(HOLD) : [];
      held.forEach((b) => { b.disabled = true; });
      const timer = held.length && setTimeout(() => held.forEach((b) => { b.disabled = false; }), wait);
      const field = root.querySelector(".histoire-field");
      if (field) {
        if (field.value) g.def.input(g, field);
        if (document.activeElement !== field) { try { field.focus({ preventScroll: true }); } catch (e) { /* sans importance */ } }
      }
      /* L'histoire se garde dès qu'elle est complète, même si personne ne l'a encore lue. */
      if (st.start && !st.w) remember(g, st);
      return () => clearTimeout(timer);
    },
    extra(k) {
      const list = kept(k);
      return list.length ? '<details class="more histoire-kept"><summary>Nos histoires (' + list.length + ')</summary><p class="hint">Vos ' + KEEP +
        " dernières histoires, gardées sur cet appareil seulement.</p>" + list.map((h, i) => '<details class="histoire-old"><summary>' + k.esc(h.n[0].slice(0, 20) + " et " + h.n[1].slice(0, 20) + " · " + (h.t.length > 60 ? h.t.slice(0, 58).replace(/\s+\S*$/, "") + "…" : h.t)) + "</summary>" + prose(k, h) + keepBtn(i) + "</details>").reverse().join("") +
        '<p><button class="link g-link" type="button" data-act="vider">' + EMPTY[Date.now() - armed < 4000 ? 1 : 0] + "</button></p></details>" : "";
    },
    extraAct(k, name, el) {
      if (name === "partager") {
        const h = kept(k)[int(parseInt(el.getAttribute("data-i"), 10), KEEP)];
        if (h) send(plain(h), el);
      } else if (name === "vider") {
        const dt = Date.now() - armed;
        if (dt >= 450 && dt < 4000) { armed = 0; k.store.del(LIST); k.render(); return; }
        if (dt < 450) return;
        armed = Date.now();
        el.textContent = EMPTY[1];
        setTimeout(() => { if (Date.now() - armed >= 4000) document.querySelectorAll('[data-act="vider"]').forEach((b) => { b.textContent = EMPTY[0]; }); }, 4050);
      }
    }
  });
})();

<script>
/* Entre Nous : socle des jeux à deux.

   Chaque jeu se joue sur UN téléphone (qu'on se passe) ou sur DEUX (chacun le sien, dans
   la même pièce ou à distance). Ce fichier fournit ce que les jeux ont en commun : la
   présentation, l'invitation, l'état partagé entre les deux téléphones (salon chiffré sur
   le même relais que les tests), l'enregistrement et la reprise. Un jeu ne s'occupe que de
   son écran et de ses règles ; il s'écrit une seule fois pour les deux façons de jouer.

   ÉCRIRE UN JEU (jeux/<id>.js, chargé avant ce fichier ; styles dans jeux/<id>.css,
   classes préfixées par l'id ; contenu dans window.GAME_DATA[id])

     (window.GAMES = window.GAMES || []).push({
       id: "onde",                 // [a-z0-9]+ ; la page du jeu est #jeu-onde
       v: 1,                       // à augmenter si la forme de l'état change : les parties et invitations d'avant sont jetées
       title: "Sur la même longueur d'onde",
       hook: "Est-ce qu'on pense au même mot ?",       // titre de la carte d'accueil et de la présentation
       blurb: "Une phrase pour la carte d'accueil.",
       meta: "10 thèmes · 5 min",
       intro: ["Paragraphe.", "Paragraphe."],           // présentation du jeu
       glyph: '<circle class="ink-a" cx="18" cy="24" r="13"/>',   // intérieur d'un SVG 48 x 48 (classes ink-a, ink-b, ring-a, ring-b)
       live: true,                 // true : partie en direct, les deux doivent être là en même temps.
                                   // false : chacun joue de son côté, en même temps ou non, et le résultat s'ouvre quand les deux ont fini.
       options: [{ id: "deck", label: "Paquet", def: "leger", duo: false,
                   choices: [{ id: "leger", name: "Léger", hint: "Pour rire.", adult: false }] }],
                                   // facultatif : choix proposés sur la présentation ; ils arrivent dans g.setup.
                                   // duo: true n'affiche l'option que là où l'on peut jouer sur deux téléphones.
       view(g) { return "<p>…</p>"; },                  // HTML de l'écran de jeu : fonction pure de g, rappelée à chaque changement
       act(g, name, el, ev) {},                         // clic sur un élément data-act="name" de l'écran de jeu
       input(g, el, ev) {}, submit(g, form, ev) {}, key(g, ev) {},   // facultatifs (le submit est déjà neutralisé)
       mount(g, root) { return () => {}; },             // facultatif : après chaque rendu (root = le <main> du jeu) ; peut
                                                        // retourner un nettoyage, appelé avant le rendu suivant et en quittant la page
       extra(kit) { return ""; }, extraAct(kit, name, el, ev) {},    // facultatifs : bloc en bas de la présentation quand aucune
                                                                     // partie n'est en cours (liste gardée, galerie) et ses clics
       over(g) { return false; }                        // facultatif : true quand la manche en cours est terminée ; l'accueil
                                                        // ne propose alors plus de « reprendre » cette partie
     });

   LA POIGNÉE g
     g.duo            true sur deux téléphones
     g.me             "a" ou "b" sur deux téléphones (qui a créé la partie est "a") ; null sur un seul
     g.gen            numéro de la manche de jeu en cours dans cette partie (1, 2, 3…)
     g.setup          { seed, ...options } de la manche en cours, identique sur les deux téléphones
     g.S.a, g.S.b     la « tranche » de chaque joueur : un petit objet JSON que seul son propriétaire écrit
                      ({} tant qu'il n'a rien écrit dans la manche en cours). En lecture seule.
     g.sh             l'état commun de la manche ({} au départ), le dernier qui écrit gagne. En lecture seule.
     g.local          objet qui reste sur cet appareil (brouillon, avancement, « j'ai vu ») : modifie-le puis g.save().
                      Vidé à chaque nouvelle manche.
     g.set(w, patch)  fusionne patch dans la tranche du joueur w, enregistre, envoie, réaffiche. Ne retourne rien.
                      Sur deux téléphones, w doit être g.me. Sur un seul, "a" et "b" sont permis.
     g.share(patch)   fusionne patch dans l'état commun, enregistre, envoie, réaffiche. Ne retourne rien.
     g.save()         enregistre g.local (sans envoi ni réaffichage)        g.render()  réaffiche
     g.newGame(patch) lance la manche suivante pour tout le monde : setup = l'ancien + patch + une nouvelle seed ;
                      tranches, état commun et g.local repartent de zéro sur les deux téléphones.
     g.stop()         termine la partie sur cet appareil (l'autre téléphone en est prévenu) et revient à la présentation
     g.hold(on)       tant que c'est tenu, ce qui arrive de l'autre téléphone est enregistré mais le réaffichage
                      attend g.hold(false). À utiliser pendant un glisser ou un trait de dessin. (Pendant un simple
                      appui, le socle diffère déjà le réaffichage tout seul.)
     g.here(w)        sur deux téléphones : le joueur w a-t-il déjà rejoint la partie ? Toujours true sur un seul.
     g.online         "ok", "wait", "err" ou "full" (relais saturé) : l'état de la liaison au moment du rendu (toujours "ok" sur un seul
                      téléphone). Un changement de liaison ne rappelle PAS view() : pour un affichage qui suit en
                      direct, place un élément <span data-net></span>, dont le socle met à jour le texte sur place.
     g.nm(w), g.other(w), g.kit, g.def, g.id
                      Les prénoms (g.nm, kit.nm et tout ce qui les utilise) sont ceux de la partie : fixés à sa
                      création et transmis par l'invitation, ils ne changent pas si on modifie ceux de l'accueil.

   RÈGLES À CONNAÎTRE
     - Un seul téléphone : g.me vaut null, c'est au jeu de savoir qui tient l'appareil (dans g.local) et de
       cacher ce que l'autre ne doit pas voir, avec kit.pass() entre les deux tours.
     - Les tranches ne se marchent jamais dessus : mets-y tout ce qui appartient à un joueur (ses réponses,
       son vote, son dessin). L'état commun sert à ce que l'un OU l'autre peut décider (carte en cours,
       phase). Si les deux y écrivent au même instant, un seul des deux objets est gardé, en entier.
     - N'appelle g.set, g.share ou g.newGame que depuis une action du joueur (ou un minuteur qu'il a lancé),
       jamais depuis view() ni en réaction automatique à ce que l'autre vient d'envoyer : les deux téléphones
       se répondraient sans fin et le relais plafonne à 250 messages par jour. Une soupape étale les envois
       au-delà de trente messages d'affilée (un toutes les huit secondes, puis un par minute passé
       quatre-vingts dans l'heure).
     - g.set envoie ta tranche entière, g.share et g.newGame envoient l'état commun entier avec g.setup
       (jamais les deux à la fois) : garde-les petits. g.setup doit rester sous 4 000 caractères (sinon
       g.newGame est refusé), et l'état commun plus g.setup sous 7 ko (sinon il ne part plus) ; une tranche peut aller jusqu'à 60 ko (un dessin), découpée en messages
       de 2,6 ko, mais chaque message compte : le relais accepte 60 requêtes d'affilée puis une toutes
       les cinq secondes pour les deux téléphones d'un même réseau, et 250 messages par jour. Vise
       quelques ko par envoi et retire ce qui ne sert plus (g.set(w, { dessin: null })).
     - Tout ce qui est rangé dans la partie peut venir de l'autre téléphone, ou de quiconque a le lien
       d'invitation : la tranche de l'autre, la tienne quand elle est restaurée depuis le relais, g.sh,
       g.setup (des deux côtés) et les prénoms. Passe chaque texte par kit.esc() avant de l'afficher et
       vérifie forme, type et bornes avant de t'en servir. Une valeur mal formée ne doit jamais bloquer l'écran.
     - Un secret n'est secret qu'à l'écran : sur deux téléphones, la tranche de l'autre est enregistrée sur ce
       téléphone (en clair dans le stockage du navigateur) dès qu'elle arrive. Ne l'affiche pas trop tôt, et
       ne promets pas aux joueurs plus que « l'autre ne le verra pas ».
     - view() peut être rappelée à tout moment (l'autre téléphone vient d'écrire). Un champ de saisie garde
       sa valeur, le focus et le curseur s'il porte data-keep="clé" ; la clé doit changer quand le champ
       change de sens (autre manche, autre joueur), sinon le texte de l'un réapparaîtrait chez l'autre.
       Le bouton qui avait le focus le garde si l'écran n'a pas changé.
     - Donne à l'élément racine de chaque écran (le premier enfant de ce que retourne view) un attribut
       data-screen="nom" (par exemple "ecrire-3", "resultat") : quand ce nom change, le socle remonte en haut
       de la page et laisse le focus aller à l'élément data-focus du nouvel écran. Cet élément racine reçoit
       la même mise en page en colonne que l'écran de jeu (assets/jeux.css).
     - Noms d'action réservés : ceux qui commencent par « g- », plus « copy » et « share ».

   LES OUTILS (g.kit)
     esc, de, que, pl, fill, other          ceux du moteur (échappement, élisions, pluriels, gabarits)
     nm(w)                                  le prénom du joueur w dans la partie affichée
     store                                  stockage local du site ; préfixe tes clés par "<id>:"
     seed()                                 un entier au hasard
     rng(seed)                              générateur reproductible : retourne une fonction qui donne des réels dans [0, 1)
     shuffle(liste, seed)                   copie mélangée, identique sur les deux téléphones pour une même seed
     who(w)                                 pastille « encre + prénom »
     pass(w, act)                           bloc « Passe le téléphone » avec un bouton data-act=act « Je suis …, à moi »
     wait(g, texte)                         bloc d'attente de l'autre (avec rappel du lien d'invitation tant qu'il n'a pas rejoint)
     buzz(motif), beep()                    vibration et bip, sans erreur s'ils sont indisponibles. Le son est
                                            débloqué au premier toucher sur la page du jeu (exigence d'iOS).
     venn(p), canRoom, render()

   LES STYLES (assets/jeux.css) : .as-a / .as-b (donnent --who et --who-soft, l'encre d'un joueur), .g-title,
   .g-lead, .g-card (+ .a / .b), .g-card-text, .g-tag (+ .a / .b), .g-who, .g-field, .g-score, .g-big,
   .g-actions (rangée de boutons collée en bas, à portée de pouce), .g-pass, .g-wait, .g-note, .g-link
   (un lien-bouton de 44 px de haut). */
(function () {
  "use strict";

  window.ENGames = function (core) {
    const store = core.store, esc = core.esc, de = core.de, other = core.other, app = core.app;
    const DEFS = (window.GAMES || []).filter((d) => d && /^[a-z0-9]+$/.test(d.id || "") && typeof d.view === "function");
    /* Sans prototype : une adresse comme #jeu-constructor ne doit trouver aucun jeu. */

    const MAX_PARTS = 24, HEAD_PARTS = 3, GEN_MAX = 1e6, ST_MAX = 1e9, N_MAX = 1e15, DAY = 864e5;
    const NET = { ok: "En ligne", wait: "Connexion…", err: "Hors ligne", full: "Relais saturé" };
    const isObj = (x) => !!x && typeof x === "object" && !Array.isArray(x);
    const isInt = (x, lo, hi) => Number.isInteger(x) && x >= lo && x <= hi;
    const isStr = (x, max) => typeof x === "string" && x.length <= max;
    const isRoom = (r, k) => isStr(r, 32) && /^[0-9a-f]{32}$/.test(r) && isStr(k, 64) && /^[\w-]{20,64}$/.test(k);
    const cleanNames = (n) => [0, 1].map((i) => (Array.isArray(n) && typeof n[i] === "string" ? n[i].trim().slice(0, 20) : ""));
    const routeDef = (route) => { const m = /^jeu-([a-z0-9]+)$/.exec(route || ""); return (m && BY[m[1]]) || null; };
    const onRoute = (id) => { const d = routeDef(core.route()); return !!d && d.id === id; };

        isInt(s.gen, 1, GEN_MAX) && okSetup(s.setup) && isObj(s.sh) && isInt(s.st, 0, ST_MAX) && (s.sw === "a" || s.sw === "b") &&
        isObj(s.S) && ["a", "b"].every((w) => isObj(s.S[w]) && typeof s.S[w].k === "string" && isObj(s.S[w].d)) &&
